<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分页测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>分页测试页面</h2>
        
        <!-- 分页 -->
        <nav aria-label="分页测试">
            <ul class="pagination justify-content-center">
                <li class="page-item">
                    <a class="page-link" href="/projects/?page=2">上一页</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="/projects/?page=1">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="/projects/?page=2">2</a>
                </li>
                <li class="page-item active">
                    <span class="page-link">3</span>
                </li>
                <li class="page-item disabled">
                    <span class="page-link">下一页</span>
                </li>
            </ul>
        </nav>
        
        <div class="mt-4">
            <p>当前页: 3</p>
            <p>点击上面的分页链接测试是否正常工作</p>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        console.log('页面加载完成');
        
        // 测试分页链接点击
        $(document).on('click', '.pagination .page-link', function(e) {
            var href = $(this).attr('href');
            console.log('点击分页链接:', href);
            if (href && href !== '#' && href !== 'javascript:void(0)') {
                console.log('准备跳转到:', href);
                // 模拟跳转
                alert('准备跳转到: ' + href);
                // window.location.href = href;
            }
        });
        
        // 测试直接点击
        $('.pagination .page-link').on('click', function(e) {
            console.log('直接绑定事件触发');
        });
    });
    </script>
</body>
</html>
