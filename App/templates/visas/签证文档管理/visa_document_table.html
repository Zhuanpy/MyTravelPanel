<!-- 签证记录列表 -->
<table class="visa-doc-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>签证类型</th>
            <th>新加坡身份</th>
            <th>文件资料</th>
            <th>补充信息</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for document in documents %}
        <tr>
            <td>{{ document.id }}</td>
            <td>{{ document.visa_type }}</td>
            <td>{{ document.singapore_identity }}</td>
            <td>{{ document.document_info[:50] }}...</td>
            <td>{{ document.additional_info[:50] }}...</td>
            <td>
                <div class="buttons are-small">
                    <button class="button is-info" onclick="openEditModal('{{ document.id }}', '{{ document.visa_type }}', '{{ document.singapore_identity }}', '{{ document.document_info|replace('\n', '\\n')|replace('\r', '\\r')|replace("'", "\\'") }}', '{{ document.additional_info|replace('\n', '\\n')|replace('\r', '\\r')|replace("'", "\\'") }}')">
                        <span class="icon">
                            <i class="fas fa-edit"></i>
                        </span>
                    </button>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
