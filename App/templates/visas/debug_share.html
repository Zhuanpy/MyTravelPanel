<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARE共用资料调试工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .debug-section {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }
        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #198754; }
        .error { color: #dc3545; }
        .warning { color: #fd7e14; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">🔧 SHARE共用资料调试工具</h1>
        
        <!-- 检查所有签证类型 -->
        <div class="debug-section">
            <h3>📋 检查所有签证类型的SHARE记录</h3>
            <p class="text-muted">检查哪些签证类型缺少SHARE共用资料记录</p>
            <button class="btn btn-primary" onclick="checkAllShareRecords()">开始检查</button>
            <div id="checkAllResult" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- 调试特定签证类型 -->
        <div class="debug-section">
            <h3>🔍 调试特定签证类型</h3>
            <p class="text-muted">详细调试指定签证类型的文档数据</p>
            <div class="row">
                <div class="col-md-8">
                    <input type="text" id="debugVisaType" class="form-control" placeholder="输入签证类型名称，例如：旅游签证">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-info" onclick="debugVisaType()">开始调试</button>
                </div>
            </div>
            <div id="debugResult" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- 修复特定签证类型 -->
        <div class="debug-section">
            <h3>🔧 修复特定签证类型</h3>
            <p class="text-muted">为指定签证类型创建SHARE记录并添加基本文档</p>
            <div class="row">
                <div class="col-md-8">
                    <input type="text" id="fixVisaType" class="form-control" placeholder="输入签证类型名称，例如：旅游签证">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-success" onclick="fixVisaType()">开始修复</button>
                </div>
            </div>
            <div id="fixResult" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- 测试文档获取 -->
        <div class="debug-section">
            <h3>🧪 测试文档获取</h3>
            <p class="text-muted">测试get_document_info方法的返回结果</p>
            <div class="row">
                <div class="col-md-6">
                    <input type="text" id="testVisaType" class="form-control" placeholder="签证类型">
                </div>
                <div class="col-md-4">
                    <input type="text" id="testIdentity" class="form-control" placeholder="身份类型（可选）">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-warning" onclick="testDocumentGet()">测试</button>
                </div>
            </div>
            <div id="testResult" class="result-box" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.innerHTML = `<div class="${type}">${content}</div>`;
        }

        function checkAllShareRecords() {
            showResult('checkAllResult', '正在检查...', 'info');
            
            fetch('/visa/documents/check_all_share_records')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let content = `<h5>检查结果：</h5>`;
                        content += `<p>总共缺少SHARE记录的签证类型：<strong>${data.total_missing}</strong> 个</p>`;
                        
                        if (data.missing_share_records.length > 0) {
                            content += `<h6>缺少SHARE记录的签证类型：</h6><ul>`;
                            data.missing_share_records.forEach(type => {
                                content += `<li>${type}</li>`;
                            });
                            content += `</ul>`;
                        } else {
                            content += `<p class="success">✅ 所有签证类型都有SHARE记录</p>`;
                        }
                        
                        showResult('checkAllResult', content, 'success');
                    } else {
                        showResult('checkAllResult', `❌ 检查失败：${data.message}`, 'error');
                    }
                })
                .catch(error => {
                    showResult('checkAllResult', `❌ 请求失败：${error.message}`, 'error');
                });
        }

        function debugVisaType() {
            const visaType = document.getElementById('debugVisaType').value.trim();
            if (!visaType) {
                alert('请输入签证类型名称');
                return;
            }
            
            showResult('debugResult', '正在调试...', 'info');
            
            fetch(`/visa/documents/debug_visa_documents/${encodeURIComponent(visaType)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showResult('debugResult', `✅ 调试完成：${data.message}<br><br>详细信息请查看浏览器控制台或服务器日志`, 'success');
                    } else {
                        showResult('debugResult', `❌ 调试失败：${data.message}`, 'error');
                    }
                })
                .catch(error => {
                    showResult('debugResult', `❌ 请求失败：${error.message}`, 'error');
                });
        }

        function fixVisaType() {
            const visaType = document.getElementById('fixVisaType').value.trim();
            if (!visaType) {
                alert('请输入签证类型名称');
                return;
            }
            
            if (!confirm(`确定要修复签证类型"${visaType}"的SHARE记录吗？`)) {
                return;
            }
            
            showResult('fixResult', '正在修复...', 'info');
            
            fetch(`/visa/documents/fix_share_documents/${encodeURIComponent(visaType)}`, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showResult('fixResult', `✅ 修复成功：${data.message}`, 'success');
                    } else {
                        showResult('fixResult', `❌ 修复失败：${data.message}`, 'error');
                    }
                })
                .catch(error => {
                    showResult('fixResult', `❌ 请求失败：${error.message}`, 'error');
                });
        }

        function testDocumentGet() {
            const visaType = document.getElementById('testVisaType').value.trim();
            const identity = document.getElementById('testIdentity').value.trim() || 'SHARE';
            
            if (!visaType) {
                alert('请输入签证类型名称');
                return;
            }
            
            showResult('testResult', '正在测试...', 'info');
            
            const url = `/visa/documents/get_visa_documents/${encodeURIComponent(visaType)}/${encodeURIComponent(identity)}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    let content = `<h5>测试结果：</h5>`;
                    content += `<p><strong>签证类型：</strong>${visaType}</p>`;
                    content += `<p><strong>身份类型：</strong>${identity}</p>`;
                    content += `<hr>`;
                    content += `<h6>文档信息：</h6>`;
                    content += `<pre style="white-space: pre-wrap;">${data.document_info || '无'}</pre>`;
                    content += `<h6>补充信息：</h6>`;
                    content += `<pre style="white-space: pre-wrap;">${data.additional_info || '无'}</pre>`;
                    
                    showResult('testResult', content, 'success');
                })
                .catch(error => {
                    showResult('testResult', `❌ 请求失败：${error.message}`, 'error');
                });
        }
    </script>
</body>
</html>
