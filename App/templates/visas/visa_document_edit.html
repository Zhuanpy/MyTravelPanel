<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>编辑 Visa Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/visa_document_edit.css') }}">
</head>
<body>
    <section class="section">
        <div class="container">
            <div class="header-container">
                
                <h1 class="title">编辑{{ document.visa_type }}资料</h1>
                
                <div class="buttons">
                    <a href="{{ url_for('visa_routes.visa_processing', visa_type=document.visa_type) }}" class="button is-info">
                        <i class="fas fa-arrow-left"></i>&nbsp;返回签证处理
                    </a>
                    <a href="{{ url_for('index.index') }}" class="home-btn">
                        <i class="fas fa-home"></i> 返回首页
                    </a>
                </div>
            </div>
            
            <form action="{{ url_for('visa_routes.update_visa', id=document.id) }}" method="post" class="box" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="field">
                    <label class="label">签证类型</label>
                    <div class="control">
                        <input class="input" type="text" name="visa_type" value="{{ document.visa_type }}" readonly>
                    </div>
                </div>
                <div class="field">
                    <label class="label">新加坡身份</label>
                    <div class="control">
                        <div class="select">
                            <select name="singapore_identity" {% if document.singapore_identity == 'SHARE' %}readonly{% endif %} autocomplete="off">
                                <option value="SHARE" {% if document.singapore_identity == 'SHARE' %}selected{% endif %}>共用资料</option>
                                <option value="PR" {% if document.singapore_identity == 'PR' %}selected{% endif %}>永久居民 (PR)</option>
                                <option value="工作准证" {% if document.singapore_identity == '工作准证' %}selected{% endif %}>工作准证</option>
                                <option value="家属准证" {% if document.singapore_identity == '家属准证' %}selected{% endif %}>家属准证</option>
                                <option value="学生准证" {% if document.singapore_identity == '学生准证' %}selected{% endif %}>学生准证</option>
                                <option value="女佣准证" {% if document.singapore_identity == '女佣准证' %}selected{% endif %}>女佣准证</option>
                            </select>
                        </div>
                    </div>
                </div>
                {% if document.singapore_identity == 'SHARE' %}
                <div class="notification is-info is-light">
                    这是共用资料，将显示在所有身份类型的文档中。
                </div>
                {% endif %}
                <div class="field">
                    <label class="label">文件资料</label>
                    <div class="control">
                        <textarea class="textarea document-info" name="document_info" autocomplete="off">{{ document.document_info }}</textarea>
                    </div>
                </div>
                <div class="field">
                    <label class="label">补充信息</label>
                    <div class="control">
                        <textarea class="textarea additional-info" name="additional_info" autocomplete="off">{{ document.additional_info }}</textarea>
                    </div>
                </div>
                <div class="field is-grouped">
                    <div class="control">
                        <button type="submit" class="button is-primary">保存修改</button>
                    </div>
                    <div class="control">
                        <a href="{{ url_for('visa_routes.manage_visas', country=document.visa_type) }}" class="button is-light">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
