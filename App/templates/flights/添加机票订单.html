{% extends "base.html" %}

{% block title %}添加机票订单{% endblock %}

{% block head %}
<style>
    .form-container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
    }
    
    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .form-title {
        font-size: 24px;
        margin: 0;
    }
    
    .form-card {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 24px;
        margin-bottom: 20px;
    }
    
    .form-section-title {
        font-size: 18px;
        color: #334155;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e2e8f0;
    }
    
    .form-row {
        display: flex;
        flex-wrap: wrap;
        margin: 0 -10px;
    }
    
    .form-col {
        padding: 0 10px;
        margin-bottom: 16px;
    }
    
    .form-col-full {
        flex: 0 0 100%;
        max-width: 100%;
    }
    
    .form-col-half {
        flex: 0 0 50%;
        max-width: 50%;
    }
    
    .form-col-third {
        flex: 0 0 33.333333%;
        max-width: 33.333333%;
    }
    
    @media (max-width: 768px) {
        .form-col-half, .form-col-third {
            flex: 0 0 100%;
            max-width: 100%;
        }
    }
    
    .form-group label {
        font-weight: 500;
        margin-bottom: 8px;
    }
    
    .form-text {
        color: #64748b;
        font-size: 0.875rem;
        margin-top: 4px;
    }
    
    .required-label::after {
        content: "*";
        color: #e11d48;
        margin-left: 2px;
    }
    
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1 class="form-title">添加机票订单</h1>
        <div>
            <a href="{{ url_for('flight_blue.flight_orders') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回列表
            </a>
        </div>
    </div>
    
    <form method="POST" action="{{ url_for('flight_blue.add_flight_order') }}">
        <!-- 基本信息 -->
        <div class="form-card">
            <h2 class="form-section-title">基本信息</h2>
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="hid_number" class="form-label">HID号码</label>
                        <input type="text" class="form-control" id="hid_number" name="hid_number">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="passenger_name" class="form-label required-label">乘机人</label>
                        <input type="text" class="form-control" id="passenger_name" name="passenger_name" required>
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="contact_person" class="form-label">联系人</label>
                        <input type="text" class="form-control" id="contact_person" name="contact_person">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="contact_phone" class="form-label">联系电话</label>
                        <input type="text" class="form-control" id="contact_phone" name="contact_phone">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="client_type" class="form-label">客户类型</label>
                        <select class="form-control" id="client_type" name="client_type">
                            <option value="个人">个人</option>
                            <option value="企业">企业</option>
                        </select>
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="operator" class="form-label">操作人员</label>
                        <input type="text" class="form-control" id="operator" name="operator">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 行程信息 -->
        <div class="form-card">
            <h2 class="form-section-title">行程信息</h2>
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="departure_date" class="form-label required-label">起飞日期</label>
                        <input type="date" class="form-control" id="departure_date" name="departure_date" required>
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="departure_time" class="form-label">起飞时间</label>
                        <input type="time" class="form-control" id="departure_time" name="departure_time">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="departure_city" class="form-label">出发城市</label>
                        <input type="text" class="form-control" id="departure_city" name="departure_city">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="arrival_date" class="form-label">到达日期</label>
                        <input type="date" class="form-control" id="arrival_date" name="arrival_date">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="arrival_time" class="form-label">到达时间</label>
                        <input type="time" class="form-control" id="arrival_time" name="arrival_time">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="arrival_city" class="form-label">到达城市</label>
                        <input type="text" class="form-control" id="arrival_city" name="arrival_city">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="airline" class="form-label">航空公司</label>
                        <input type="text" class="form-control" id="airline" name="airline">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="flight_number" class="form-label">航班号</label>
                        <input type="text" class="form-control" id="flight_number" name="flight_number">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="cabin_class" class="form-label">舱位等级</label>
                        <select class="form-control" id="cabin_class" name="cabin_class">
                            <option value="">请选择</option>
                            <option value="经济舱">经济舱</option>
                            <option value="商务舱">商务舱</option>
                            <option value="头等舱">头等舱</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" id="is_transit" name="is_transit">
                            <label class="form-check-label" for="is_transit">
                                是否中转
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-col form-col-two-thirds">
                    <div class="form-group">
                        <label for="transit_info" class="form-label">中转信息</label>
                        <input type="text" class="form-control" id="transit_info" name="transit_info">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-full">
                    <div class="form-group">
                        <label for="itinerary" class="form-label">行程详情</label>
                        <textarea class="form-control" id="itinerary" name="itinerary" rows="4"></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 票务信息 -->
        <div class="form-card">
            <h2 class="form-section-title">票务信息</h2>
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="order_status" class="form-label">订单状态</label>
                        <select class="form-control" id="order_status" name="order_status">
                            <option value="待出票">待出票</option>
                            <option value="已出票">已出票</option>
                            <option value="已取消">已取消</option>
                            <option value="已完成">已完成</option>
                        </select>
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="payment_status" class="form-label">支付状态</label>
                        <select class="form-control" id="payment_status" name="payment_status">
                            <option value="待支付">待支付</option>
                            <option value="已支付">已支付</option>
                            <option value="已退款">已退款</option>
                        </select>
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="payment_method" class="form-label">支付方式</label>
                        <select class="form-control" id="payment_method" name="payment_method">
                            <option value="">请选择</option>
                            <option value="微信">微信</option>
                            <option value="支付宝">支付宝</option>
                            <option value="银行转账">银行转账</option>
                            <option value="现金">现金</option>
                            <option value="信用卡">信用卡</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="total_price" class="form-label">票价总额</label>
                        <input type="number" step="0.01" class="form-control" id="total_price" name="total_price">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="tax_fee" class="form-label">税费</label>
                        <input type="number" step="0.01" class="form-control" id="tax_fee" name="tax_fee">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="actual_payment" class="form-label">实付金额</label>
                        <input type="number" step="0.01" class="form-control" id="actual_payment" name="actual_payment">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="baggage_allowance" class="form-label">行李额度</label>
                        <input type="text" class="form-control" id="baggage_allowance" name="baggage_allowance">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="pnr_code" class="form-label">PNR号码</label>
                        <input type="text" class="form-control" id="pnr_code" name="pnr_code">
                    </div>
                </div>
                <div class="form-col form-col-third">
                    <div class="form-group">
                        <label for="e_ticket_number" class="form-label">电子客票号</label>
                        <input type="text" class="form-control" id="e_ticket_number" name="e_ticket_number">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col form-col-full">
                    <div class="form-group">
                        <label for="refund_change_policy" class="form-label">退改签政策</label>
                        <textarea class="form-control" id="refund_change_policy" name="refund_change_policy" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 备注信息 -->
        <div class="form-card">
            <h2 class="form-section-title">备注信息</h2>
            <div class="form-row">
                <div class="form-col form-col-full">
                    <div class="form-group">
                        <label for="remarks" class="form-label">备注</label>
                        <textarea class="form-control" id="remarks" name="remarks" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('flight_blue.flight_orders') }}" class="btn btn-secondary">取消</a>
            <button type="submit" class="btn btn-primary">提交</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 设置默认日期为今天
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('departure_date').value = today;
    });
    
    // 自动计算实付金额
    document.addEventListener('DOMContentLoaded', function() {
        const totalPriceInput = document.getElementById('total_price');
        const taxFeeInput = document.getElementById('tax_fee');
        const actualPaymentInput = document.getElementById('actual_payment');
        
        function calculateTotal() {
            const totalPrice = parseFloat(totalPriceInput.value) || 0;
            const taxFee = parseFloat(taxFeeInput.value) || 0;
            actualPaymentInput.value = (totalPrice + taxFee).toFixed(2);
        }
        
        totalPriceInput.addEventListener('input', calculateTotal);
        taxFeeInput.addEventListener('input', calculateTotal);
    });
</script>
{% endblock %}
