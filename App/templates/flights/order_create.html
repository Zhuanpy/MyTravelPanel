{% extends "staff/base.html" %}

{% block title %}创建机票订单 - MyTravelPanel{% endblock %}

{% block page_title %}创建机票订单{% endblock %}

{% block extra_css %}
<!-- 添加 Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<!-- 添加 jQuery UI 样式 -->
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<!-- 添加 Select2 样式 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<!-- 添加公共机票订单样式 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/flight_order_common.css') }}?v=5.1&t=20250731">

<style>
    /* 页面特定样式可以在这里添加 */
</style>
{% endblock %}

{% block content %}
<div class="order-container">

    <form id="orderForm" method="POST" action="{{ url_for('flights_booking.submit_order') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="project_header_id" value="{{ header_id }}">
        <input type="hidden" name="project_ref_id" value="{{ ref_id or '' }}">
        <!-- 航段解析器 - 隐藏，只通过模态框访问 -->
        <div class="order-card" style="display: none;">
            <h2 class="order-section-title">航段解析</h2>
            <div class="order-form-group">
                <label class="order-label">粘贴航段信息</label>
                <textarea class="order-input" id="flightParser" rows="5" placeholder="请粘贴航段信息，例如：&#10;CX 714 O 30JUN SINHKG HS1 0150 0550 O E MO 1"></textarea>
                <div class="mt-3">
                    <button type="button" class="order-btn order-btn-primary" onclick="parseFlightSegments()">
                        <i class="fas fa-magic"></i> 解析航段
                    </button>
                    <button type="button" class="order-btn order-btn-secondary" onclick="clearParser()">
                        <i class="fas fa-eraser"></i> 清空
                    </button>
                </div>
            </div>
        </div>

        <!-- 航段信息 -->
        <div class="order-card">
            <h2 class="order-section-title">航段信息</h2>
            <div id="flightSegmentsContainer">
                <!-- 初始航段信息 -->
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="button" class="order-btn order-btn-primary" onclick="addFlightSegment(null, true)">
                    <i class="fas fa-plus"></i> 添加航段
                </button>
                <button type="button" class="order-btn order-btn-secondary" onclick="openFlightParserModal()">
                    <i class="fas fa-magic"></i> 航段解析
                </button>
            </div>
        </div>

        <!-- 乘客信息 -->
        <div class="order-card">
            <h2 class="order-section-title">乘客信息</h2>
            <div id="passengersContainer">
                <!-- 乘客信息将在这里动态添加 -->
            </div>
            <button type="button" class="order-btn order-btn-primary" onclick="addPassenger()">
                <i class="fas fa-plus"></i> 添加乘客
            </button>
        </div>


        <!-- 信息布局容器 -->
        <div style="display: flex; gap: 20px; align-items: flex-start;">
            <!-- 左侧信息 -->
            <div style="flex: 2; min-width: 0;">
                <!-- 供应商和状态信息 -->
                <div class="order-card">
                    <h2 class="order-section-title">供应商和状态信息</h2>
                    <div style="display: flex; flex-wrap: nowrap; gap: 10px; align-items: flex-end; overflow-x: auto;">
                        <div style="width: 150px; min-width: 150px; flex-shrink: 0;">
                            <label class="order-label">供应商类型</label>
                            <select class="order-input" id="supplier_type" onchange="filterSuppliers()">
                                <option value="">所有类型</option>
                                {% for type in supplier_types %}
                                <option value="{{ type }}">
                                    {% if type == 'visa' %}签证
                                    {% elif type == 'flight' %}机票
                                    {% elif type == 'hotel' %}酒店
                                    {% elif type == 'transport' %}用车
                                    {% elif type == 'local_operator' %}地接
                                    {% else %}其他
                                    {% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div style="width: 200px; min-width: 200px; flex-shrink: 0;">
                            <label class="order-label">供应商名称</label>
                            <select class="order-input" name="supplier_name" id="supplier_name" required>
                                <option value="">请选择供应商</option>
                                {% for supplier in suppliers %}
                                <option value="{{ supplier.name }}" data-type="{{ supplier.supplier_type }}">{{ supplier.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div style="width: 150px; min-width: 150px; flex-shrink: 0;">
                            <label class="order-label">状态</label>
                            <select class="order-input" name="status">
                                <option value="draft">草稿</option>
                                <option value="processing">处理中</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                        </div>
                        <div style="width: 150px; min-width: 150px; flex-shrink: 0;">
                            <label class="order-label">支付状态</label>
                            <select class="order-input" name="payment_status">
                                <option value="unpaid">未付款</option>
                                <option value="partial">部分付款</option>
                                <option value="paid">已付款</option>
                                <option value="refunded">已退款</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 联系人信息 -->
                <div class="order-card">
                    <h2 class="order-section-title">联系人信息</h2>
                    <div style="display: flex; flex-wrap: nowrap; gap: 10px; align-items: flex-end; overflow-x: auto;">
                        <div style="width: 220px; min-width: 220px; flex-shrink: 0;">
                            <label class="order-label required">联系人姓名</label>
                            <input type="text" class="order-input" name="contact_name" style="width: 100%; box-sizing: border-box;" required>
                        </div>
                        <div style="width: 170px; min-width: 170px; flex-shrink: 0;">
                            <label class="order-label">联系电话</label>
                            <input type="tel" class="order-input" name="contact_phone" style="width: 100%; box-sizing: border-box;">
                        </div>
                        <div style="width: 220px; min-width: 220px; flex-shrink: 0;">
                            <label class="order-label">电子邮箱</label>
                            <input type="email" class="order-input" name="contact_email" style="width: 100%; box-sizing: border-box;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧备注信息 -->
            <div style="flex: 3; min-width: 0; max-width: 600px;">
                <!-- 备注信息 -->
                <div class="order-card">
                    <h2 class="order-section-title">备注信息</h2>
                    <div style="display: flex; gap: 20px; align-items: flex-start;">
                        <div style="flex: 1; min-width: 0;">
                            <label class="order-label">备注信息</label>
                            <textarea class="order-input" name="remarks" rows="8" placeholder="请输入备注信息" style="width: 100%; box-sizing: border-box; min-height: 150px;"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 提交按钮 -->
        <div class="text-center">
            <button type="submit" class="order-btn order-btn-primary">
                <i class="fas fa-save"></i> 提交订单
            </button>
            <a href="{{ url_for('flights_booking.order_list') }}" class="order-btn order-btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回列表
            </a>
        </div>
    </form>

    <!-- 航段解析模态框 -->
    <div id="flightParserModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
        <div class="modal-content" style="background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 800px; border-radius: 8px;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; color: #2d3748;">航段解析</h3>
                <span class="close" onclick="closeFlightParserModal()" style="color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 15px;">
                    <label class="order-label">粘贴航段信息</label>
                    <textarea class="order-input" id="modalFlightParser" rows="8" placeholder="请粘贴航段信息，例如：&#10;CX 714 O 30JUN SINHKG HS1 0150 0550 O E MO 1" style="width: 100%; box-sizing: border-box; margin-bottom: 10px;"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button type="button" class="order-btn order-btn-primary" onclick="parseFlightSegmentsFromModal()">
                        <i class="fas fa-magic"></i> 解析航段
                    </button>
                    <button type="button" class="order-btn order-btn-secondary" onclick="clearModalParser()">
                        <i class="fas fa-eraser"></i> 清空
                    </button>
                </div>
            </div>
            <div class="modal-footer" style="text-align: right; margin-top: 20px;">
                <button type="button" class="order-btn order-btn-secondary" onclick="closeFlightParserModal()">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- 添加必要的JavaScript -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<!-- 添加 Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
// 等待所有必要的脚本加载完成
document.addEventListener('DOMContentLoaded', function() {
    // 确保jQuery和Select2都已加载
    function waitForDependencies() {
        if (typeof jQuery !== 'undefined' && typeof jQuery.fn.select2 !== 'undefined') {
            initializePage();
        } else {
            setTimeout(waitForDependencies, 100);
        }
    }

    function initializePage() {
        // Select2配置对象
        window.select2Config = {
            placeholder: '请输入机场代码、城市名或机场名',
            minimumInputLength: 2,
            language: {
                inputTooShort: function() {
                    return '请至少输入2个字符';
                },
                noResults: function() {
                    return '未找到匹配的机场';
                },
                searching: function() {
                    return '搜索中...';
                }
            },
            ajax: {
                url: '{{ url_for("flights_booking.search_airports") }}',
                dataType: 'json',
                delay: 250,
                data: function(params) {
                    return {
                        q: params.term
                    };
                },
                processResults: function(data) {
                    return {
                        results: data
                    };
                },
                cache: true
            }
        };

        // 初始化页面 - 添加一个乘客和一个默认航段
        addPassenger();
        addFlightSegment(null, true);  // 添加一个默认航段
    }

    // 开始等待依赖项加载
    waitForDependencies();
});

// 供应商类型筛选函数
function filterSuppliers() {
    const typeFilter = document.getElementById('supplier_type').value;
    const supplierSelect = document.getElementById('supplier_name');
    const options = supplierSelect.querySelectorAll('option');
    
    // 保存当前选中的值
    const currentValue = supplierSelect.value;
    
    // 首先隐藏除默认选项外的所有选项
    options.forEach(option => {
        if (option.value === '') {
            // 保留默认"请选择供应商"选项
            option.style.display = '';
        } else {
            // 根据类型筛选显示其他选项
            if (!typeFilter || option.dataset.type === typeFilter) {
                option.style.display = '';
            } else {
                option.style.display = 'none';
            }
        }
    });
    
    // 如果当前选中的选项被隐藏了，则重置为默认选项
    if (currentValue) {
        const currentOption = Array.from(options).find(o => o.value === currentValue);
        if (currentOption && currentOption.style.display === 'none') {
            supplierSelect.value = '';
        }
    }
}

function initializeSelect2(element) {
    if (!$(element).data('select2')) {  // 检查是否已经初始化
        const config = Object.assign({}, window.select2Config, {
            placeholder: $(element).data('placeholder') || window.select2Config.placeholder
        });
        $(element).select2(config);
    }
}

function addFlightSegment(data = null, isManualAdd = false) {
    // 如果没有数据且不是手动添加，则返回
    if (!data && !isManualAdd) {
        return;
    }

    const template = `
        <div class="flight-segment">
            <button type="button" class="remove-btn" onclick="removeElement(this)">
                <i class="fas fa-times"></i>
            </button>
            <table>
                <tr>
                    <!-- 航班号 -->
                    <td class="flight-number-col">
                        <label class="order-label required">航班号</label>
                        <input type="text" class="order-input" name="flight_number[]" value="${data ? data.flightNumber : ''}" placeholder="如:CA123" required>
                    </td>
                    
                    <!-- 舱位 -->
                    <td class="cabin-code-col">
                        <label class="order-label required">舱位</label>
                        <input type="text" class="order-input" name="cabin_code[]" value="${data ? data.cabinCode : ''}" placeholder="如:Y" required>
                    </td>
                    
                    <!-- 出发机场 -->
                    <td class="airport-col">
                        <label class="order-label required">出发机场</label>
                        <select class="order-select airport-select" name="departure_airport[]" required data-placeholder="输入机场代码">
                            ${data ? `<option value="${data.departureAirport}" selected>${data.departureAirport}</option>` : '<option></option>'}
                        </select>
                    </td>
                    
                    <!-- 到达机场 -->
                    <td class="airport-col">
                        <label class="order-label required">到达机场</label>
                        <select class="order-select airport-select" name="arrival_airport[]" required data-placeholder="输入机场代码">
                            ${data ? `<option value="${data.arrivalAirport}" selected>${data.arrivalAirport}</option>` : '<option></option>'}
                        </select>
                    </td>
                    
                    <!-- 出发日期 -->
                    <td class="date-col">
                        <label class="order-label required">出发日期</label>
                        <input type="date" class="order-input" name="departure_date[]" value="${data ? data.departureDate : ''}" required>
                    </td>
                    
                    <!-- 出发时间 -->
                    <td class="time-col">
                        <label class="order-label">出发时间</label>
                        <input type="time" class="order-input" name="departure_time[]" value="${data ? data.departureTime : ''}">
                    </td>
                    
                    <!-- 到达日期 -->
                    <td class="date-col">
                        <label class="order-label required">到达日期</label>
                        <input type="date" class="order-input" name="arrival_date[]" value="${data ? data.arrivalDate : ''}" required>
                    </td>
                    
                    <!-- 到达时间 -->
                    <td class="time-col">
                        <label class="order-label">到达时间</label>
                        <input type="time" class="order-input" name="arrival_time[]" value="${data ? data.arrivalTime : ''}">

    const $newSegment = $(template);

    // 初始化新添加的Select2

function addPassenger() {
    const template = `
        <div class="passenger-card">
            <button type="button" class="remove-btn" onclick="removeElement(this)">
                <i class="fas fa-times"></i>
            </button>
            <div class="passenger-form">
                <!-- 乘客姓名 -->
                <div class="passenger-field passenger-field-name">
                    <label class="required">乘客姓名</label>
                    <input type="text" class="order-input" name="passenger_name[]" required>

                <!-- 乘客类型 -->

                        <option value="adult">成人</option>
                        <option value="child">儿童</option>
                        <option value="infant">婴儿</option>
                    </select>
                </div>
                
                <!-- 售价 -->
                <div class="passenger-field" style="width: 170px; min-width: 170px; flex-shrink: 0;">
                    <label class="required">售价</label>
                    <div style="position: relative; display: flex; align-items: center;">

                    </div>
                </div>
                
                <!-- 成本 -->
                <div class="passenger-field" style="width: 170px; min-width: 170px; flex-shrink: 0;">
                    <label>成本</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <span style="position: absolute; left: 8px; color: #4a5568; font-size: 0.85rem; font-weight: 500; pointer-events: none; z-index: 1;">SGD</span>

                </div>
                
                <!-- 电子客票号 -->
                <div class="passenger-field" style="width: 170px; min-width: 170px; flex-shrink: 0;">

                    <input type="text" class="order-input" name="ticket_number[]" placeholder="可选">
                </div>
                
                <!-- PNR编码 -->
                <div class="passenger-field" style="width: 120px; min-width: 120px; flex-shrink: 0;">
                    <label>PNR编码</label>

function removeElement(button) {
    const container = $(button).closest('.passenger-card, .flight-segment');
    const containerType = container.hasClass('passenger-card') ? 'passenger-card' : 'flight-segment';
    const minElements = 1;
    
    if ($(`.${containerType}`).length > minElements) {
        container.remove();
    } else {
        alert('至少需要保留一个' + (containerType === 'passenger-card' ? '乘客' : '航段'));
    }
}

// 表单提交前验证
$('#orderForm').on('submit', function(e) {
    if ($('.passenger-card').length === 0) {
        alert('请至少添加一个乘客');
        e.preventDefault();
        return false;
    }
    
    if ($('.flight-segment').length === 0) {
        alert('请至少添加一个航段');
        e.preventDefault();
        return false;
    }
    
    // 合并日期和时间字段
    try {
        $('.flight-segment').each(function() {
            const segment = $(this);
            
            // 检查必填字段
            const depDate = segment.find('input[name="departure_date[]"]').val();
            const arrDate = segment.find('input[name="arrival_date[]"]').val();
            
            if (!depDate || !arrDate) {
                throw new Error('请填写所有必需的日期字段');
            }
            
            // 获取时间值，使用默认值00:00替代空值
            let depTime = segment.find('input[name="departure_time[]"]').val();
            let arrTime = segment.find('input[name="arrival_time[]"]').val();
            
            // 确保时间值不为空
            if (!depTime || depTime.trim() === '') depTime = '00:00';
            if (!arrTime || arrTime.trim() === '') arrTime = '00:00';
            
            const cabinCode = segment.find('input[name="cabin_code[]"]').val();
            
            // 修改原时间字段的值为合并后的日期时间
            const depDateTime = `${depDate} ${depTime}`;
            const arrDateTime = `${arrDate} ${arrTime}`;
            
            // 移除旧的时间字段，创建新的隐藏字段
            segment.find('input[name="departure_time[]"]').prop('disabled', true);
            segment.find('input[name="arrival_time[]"]').prop('disabled', true);
            
            // 创建新的隐藏字段，确保名称不会冲突
            $('<input>').attr({
                type: 'hidden',
                name: 'departure_time[]',
                value: depDateTime
            }).appendTo(segment);
            
            $('<input>').attr({
                type: 'hidden',
                name: 'arrival_time[]',
                value: arrDateTime
            }).appendTo(segment);
            
            // 禁用日期字段，这样不会被提交
            segment.find('input[name="departure_date[]"]').prop('disabled', true);
            segment.find('input[name="arrival_date[]"]').prop('disabled', true);
            
            // 添加cabin_class隐藏字段，值与cabin_code相同
            $('<input>').attr({
                type: 'hidden',
                name: 'cabin_class[]',
                value: cabinCode
            }).appendTo(segment);
        });
        
        return true;
    } catch (error) {
        console.error('处理日期时间时出错:', error);
        alert('提交表单时出错: ' + error.message);
        e.preventDefault();
        return false;
    }
});

// 解析航段信息
function parseFlightSegments() {
    const text = document.getElementById('flightParser').value.trim();
    if (!text) {
        alert('请先粘贴航段信息');
        return;
    }

    // 清空现有航段
    $('#flightSegmentsContainer').empty();

    // 按行分割，处理不同的换行符和可能的特殊字符
    const lines = text.split(/[\n\r>]+/).filter(line => {
        const trimmed = line.trim();
        return trimmed && !trimmed.startsWith('>'); // 过滤掉空行和以>开头的行
    });

    console.log('解析的行数:', lines.length);
    let successCount = 0;
    
    // 解析每一行
    lines.forEach((line, index) => {
        // 移除行号和多余空格
        const cleanLine = line.replace(/^\d+\.\s*/, '').trim();
        if (!cleanLine) return;

        // 使用更宽松的正则表达式匹配航班信息
        const match = cleanLine.match(/(\w+)\s+(\d+)\s+(\w)\s+(\d{2}\w{3})\s+(\w{6})\s+\w+\s+(\d{4})\s+(#?\d{4})/);
        
        if (!match) {
            console.log('行格式不匹配，跳过:', line);
            return;
        }

        try {
            // 提取匹配的信息
            const [_, airline, flightNumber, cabinCode, date, route, departureTime, arrivalTime] = match;
            const departureAirport = route.substring(0, 3);
            const arrivalAirport = route.substring(3);
            const isNextDay = arrivalTime.startsWith('#');
            const cleanArrivalTime = arrivalTime.replace('#', '');

            // 创建日期对象
            const year = new Date().getFullYear();
            const month = getMonthFromString(date.substring(2, 5));
            const day = parseInt(date.substring(0, 2));

            console.log('解析日期信息:', {
                original: date,
                year: year,
                month: month,
                day: day
            });

            // 格式化出发和到达时间
            const departureDateTime = formatDateTime(year, month, day, departureTime);
            const arrivalDateTime = formatDateTime(year, month, day, cleanArrivalTime, isNextDay);

            console.log('格式化后的时间:', {
                departure: departureDateTime,
                arrival: arrivalDateTime
            });

            // 创建航段数据对象
            const segmentData = {
                flightNumber: `${airline}${flightNumber}`,
                cabinCode: cabinCode,
                cabinClass: cabinCode,
                departureAirport: departureAirport,
                arrivalAirport: arrivalAirport,
                departureDate: departureDateTime.date,
                departureTime: departureDateTime.time,
                arrivalDate: arrivalDateTime.date,
                arrivalTime: arrivalDateTime.time
            };

            console.log('添加航段数据:', segmentData);

            // 创建航段
            addFlightSegment(segmentData);
            
            successCount++;
            console.log('成功添加航段:', `${airline}${flightNumber}`, isNextDay ? '(跨日航班)' : '');
        } catch (error) {
            console.error('解析行时出错:', error);
            console.error('问题行:', line);
        }
    });

    if (successCount === 0) {
        alert('没有成功解析任何航段，请检查输入格式是否正确');
    }
}

// 辅助函数：将月份字符串转换为数字
function getMonthFromString(month) {
    const months = {
        'JAN': 1, 'FEB': 2, 'MAR': 3, 'APR': 4, 'MAY': 5, 'JUN': 6,
        'JUL': 7, 'AUG': 8, 'SEP': 9, 'OCT': 10, 'NOV': 11, 'DEC': 12
    };
    return months[month.toUpperCase()];
}

// 辅助函数：格式化日期时间
function formatDateTime(year, month, day, time, isNextDay = false) {
    const hours = parseInt(time.substring(0, 2));
    const minutes = parseInt(time.substring(2));
    
    // 使用 UTC 来避免时区问题
    const date = new Date(Date.UTC(year, month - 1, day));
    
    // 处理跨日情况
    if (isNextDay) {
        date.setUTCDate(date.getUTCDate() + 1);
    }

    // 格式化日期和时间
    const formattedDate = date.toISOString().split('T')[0];
    const formattedTime = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

    console.log('格式化日期时间:', {
        input: { year, month, day, time, isNextDay },
        output: { date: formattedDate, time: formattedTime },
        utcDate: date.toISOString()
    });
    
    return {
        date: formattedDate,
        time: formattedTime
    };
}

}
