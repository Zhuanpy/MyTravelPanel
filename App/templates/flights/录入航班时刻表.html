<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航班时刻表信息</title>
    <style>
        body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 15px;
        }
        .form-container, .table-container, .search-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button {
            cursor: pointer;
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            color: #fff;
        }
        .btn-primary {
            background-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #a71d2a;
        }
        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #1c7430;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f8f9fa;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .pagination a {
            padding: 5px 10px;
            margin: 0 5px;
            background-color: #f1f1f1;
            text-decoration: none;
            color: #333;
            border-radius: 4px;
        }
        .pagination a:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/">Home page</a>
        <h1>航班时刻表信息</h1>

        <!-- 航班信息输入表单 -->
        <div class="form-container">
            <h2>输入航班信息</h2>
            <form id="flightForm" method="POST" action="{{ url_for('flight_blue.input_flight_schedule_info') }}">
                <input type="hidden" name="search_flight_number" value="{{ request.args.get('search_flight_number', '') }}">
                <!-- ↑↑↑ 新增隐藏字段，提交后仍保持搜索状态 -->
                <div>
                    <label for="flightNumber">航班号:</label>
                    <input type="text" id="flightNumber" name="flight_number" placeholder="例如: TR100">
                </div>
                <div>
                    <label for="scheduleCity">起始地点:</label>
                    <input type="text" id="scheduleCity" name="schedule_city" placeholder="例如: SIN CAN">
                </div>
                <div>
                    <label for="scheduleTiming">起始时间:</label>
                    <input type="text" id="scheduleTiming" name="schedule_timing" placeholder="例如: 0515 0925">
                </div>
                <button type="submit" class="btn-success">提交</button>
            </form>
        </div>

        <!-- 搜索航班 -->
        <div class="search-container">
            <h2>搜索航班</h2>
            <form id="searchForm" method="GET" action="{{ url_for('flight_blue.search_flights') }}">
                <input type="text" name="search_flight_number" placeholder="输入航班号" value="{{ request.args.get('search_flight_number', '') }}">
                <!-- ↑↑↑ 修改：保持搜索输入值 -->
                <button type="submit" class="btn-primary">搜索</button>
            </form>
        </div>

        <!-- 航班时刻表 -->
        <div class="table-container">
            <h2>航班时刻表</h2>
            <table>
                <thead>
                    <tr>
                        <th>航班号</th>
                        <th>起始地点</th>
                        <th>起始时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for flight in flights.items %}
                    <tr>
                        <td>{{ flight.flight_number }}</td>
                        <td>{{ flight.schedule_city }}</td>
                        <td>
                            <input type="text" value="{{ flight.schedule_timing }}" class="edit-timing" data-flight-id="{{ flight.id }}">
                        </td>
                        <td>
                            <button class="btn-success save-button" data-flight-id="{{ flight.id }}">保存</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <!-- 分页导航 -->
            <div class="pagination">
                {% if flights.has_prev %}
                <a href="{{ url_for('flight_blue.input_flight_schedule_info', page=flights.prev_num, search_flight_number=request.args.get('search_flight_number', '')) }}">上一页</a>
                {% endif %}
                <span>第 {{ flights.page }} 页，共 {{ flights.pages }} 页</span>
                {% if flights.has_next %}
                <a href="{{ url_for('flight_blue.input_flight_schedule_info', page=flights.next_num, search_flight_number=request.args.get('search_flight_number', '')) }}">下一页</a>
                {% endif %}
                <!-- ↑↑↑ 修改：分页链接保持搜索参数 -->
            </div>
        </div>
    </div>
</body>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".save-button").forEach(button => {
            button.addEventListener("click", function () {
                let flightId = this.getAttribute("data-flight-id");
                let inputField = document.querySelector(`input[data-flight-id='${flightId}']`);
                let newTiming = inputField.value;
    
                fetch("{{ url_for('flight_blue.update_flight_timing') }}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        flight_id: flightId,
                        schedule_timing: newTiming
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("更新成功！");
                    } else {
                        alert("更新失败：" + data.error);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("请求失败，请检查网络连接！");
                });
            });
        });
    });
    </script>
    
</html>
