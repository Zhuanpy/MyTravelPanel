{% extends "base.html" %}

{% block title %}机票行程转化{% endblock %}

{% block head %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
<style>
    /* 使用唯一的前缀避免冲突 */
    .flight-app {
        width: 100%;
        margin: 0 auto;
        padding: 0;
    }
    
    /* 主容器 */
    .flight-app-container {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    
    /* 标题 */
    .flight-app-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 25px;
        color: #333;
        text-align: center;
    }
    
    /* 表单样式 */
    .flight-app-form-row {
        display: block;
        margin-bottom: 20px;
    }
    
    /* 新增样式：左右排布行程容器 */
    .flight-app-itinerary-container {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }
    
    /* 左右行程列 */
    .flight-app-itinerary-column {
        flex: 1;
        width: 50%;
    }
    
    .flight-app-label {
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: normal;
        margin-bottom: 8px;
    }
    
    .flight-app-label i {
        margin-right: 5px;
    }
    
    .flight-app-input-wrapper {
        flex: 1;
    }
    
    /* 输入框样式 */
    .flight-app-textarea {
        width: 100%;
        height: 200px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 0;
        font-size: 14px;
        resize: none;
        display: block;
    }
    
    .flight-app-input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 0;
        font-size: 14px;
        display: block;
    }
    
    /* 底部按钮行 */
    .flight-app-bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }
    
    .flight-app-radio-group {
        display: flex;
        align-items: center;
        margin: 0;
    }
    
    .flight-app-btn-container {
        text-align: right;
    }
    
    .flight-app-btn {
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        padding: 6px 15px;
        border-radius: 0;
        cursor: pointer;
        font-size: 14px;
    }

    /* 响应式设计 */
    @media (max-width: 600px) {
        .flight-app-form-row {
            flex-direction: column;
            align-items: flex-start;
        }
        .flight-app-label {
            width: 100%;
            margin-bottom: 5px;
        }
        .flight-app-bottom-row {
            flex-direction: column;
            align-items: flex-start;
        }
        .flight-app-btn-container {
            margin-top: 15px;
            text-align: left;
            width: 100%;
        }
        /* 响应式：小屏幕上恢复为上下排列 */
        .flight-app-itinerary-container {
            flex-direction: column;
        }
        .flight-app-itinerary-column {
            width: 100%;
        }
    }

    /* 行李和价格输入行 */
    .flight-app-luggage-price-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 15px;
    }
    
    .flight-app-luggage-price-item {
        flex: 1;
        max-width: 48%;
    }
    
    .flight-app-luggage-price-item .flight-app-label {
        width: auto;
        margin-right: 10px;
        margin-bottom: 8px;
    }

    /* 行李选择容器 */
    .flight-app-luggage-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    
    /* 下拉选择框样式 */
    .flight-app-select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 0;
        font-size: 14px;
        background-color: #f8f9fa;
    }
    
    .flight-app-select:focus {
        outline: none;
        border-color: #4299e1;
    }

    /* 输出框容器样式 */
    .flight-app-output-container {
        position: relative;
        height: 100%;
    }
    
    /* 复制按钮样式 */
    .flight-app-copy-btn {
        position: absolute;
        top: 0;
        right: 0;
        background-color: #f8f9fa;
        border: 1px solid #ccc;
        border-top: none;
        border-right: none;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
        z-index: 10;
    }
    
    .flight-app-copy-btn:hover {
        background-color: #e9ecef;
    }
</style>
{% endblock %}

{% block content %}
<div class="flight-app">
    <div class="flight-app-container">
        
        <h1 class="flight-app-title">机票行程转化</h1>
        
        <form action="{{ url_for('flights_athina.itinerary_conversion') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flight-app-itinerary-container">
                <div class="flight-app-itinerary-column">
                    <label for="input_text" class="flight-app-label">
                        <i class="fas fa-plane-departure"></i> 输入行程：
                    </label>
                    <div class="flight-app-input-wrapper">
                        <textarea id="input_text" name="input_text" class="flight-app-textarea">{{ request.form['input_text'] }}</textarea>
                    </div>
                </div>
                
                <div class="flight-app-itinerary-column">
                    <label for="output_text" class="flight-app-label">
                        <i class="fas fa-plane-arrival"></i> 输出行程：
                    </label>
                    <div class="flight-app-input-wrapper flight-app-output-container">
                        <button type="button" class="flight-app-copy-btn" onclick="copyOutputText()">
                            <i class="fas fa-copy"></i> 复制
                        </button>
                        <textarea id="output_text" name="output_text" class="flight-app-textarea">{{ output_text }}</textarea>
                    </div>
                </div>
            </div>
            
            <div class="flight-app-luggage-price-row">
                <div class="flight-app-luggage-price-item">
                    <label for="luggage" class="flight-app-label">
                        <i class="fas fa-suitcase"></i> 行李：
                    </label>
                    <div class="flight-app-input-wrapper">
                        <div class="flight-app-luggage-container">
                            <select id="luggage_select" class="flight-app-select" onchange="updateLuggageInput(this.value)">
                                <option value="">-- 选择常用行李 --</option>
                                <option value="0kg">0kg</option>
                                <option value="20kg">20kg</option>
                                <option value="23kg">23kg</option>
                                <option value="25kg">25kg</option>
                                <option value="30kg">30kg</option>
                                <option value="40kg">40kg</option>
                                <option value="46kg(23kg*2)">46kg(23kg*2)</option>
                            </select>
                            <input type="text" id="luggage" name="luggage" class="flight-app-input" value="{{ request.form['luggage'] }}" placeholder="自定义行李额度">
                        </div>
                    </div>
                </div>
                
                <div class="flight-app-luggage-price-item">
                    <label for="price" class="flight-app-label">
                        <i class="fas fa-tag"></i> 价格：
                    </label>
                    <div class="flight-app-input-wrapper">
                        <input type="text" id="price" name="price" class="flight-app-input" value="{{ request.form['price'] }}">
                    </div>
                </div>
            </div>
            
            <div class="flight-app-bottom-row">
                <div class="flight-app-radio-group">
                    <div class="flight-app-radio-item">
                        <input type="radio" id="chinese" name="language" value="chinese" {% if not request.form['language'] or request.form['language'] == 'chinese' %}checked{% endif %}>
                        <label for="chinese">中文行程</label>
                    </div>
                    <div class="flight-app-radio-item">
                        <input type="radio" id="english" name="language" value="english" {% if request.form['language'] == 'english' %}checked{% endif %}>
                        <label for="english">English itinerary</label>
                    </div>
                </div>
                
                <div class="flight-app-btn-container">
                    <input type="submit" value="开始转换" class="flight-app-btn">
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var outputTextarea = document.getElementById('output_text');
        if(outputTextarea) {
            outputTextarea.addEventListener('focus', function() {
                this.select();
            });
        }
        
        // 初始化行李选择下拉框的值
        var luggageInput = document.getElementById('luggage');
        var luggageSelect = document.getElementById('luggage_select');
        
        if(luggageInput && luggageSelect) {
            // 如果输入框有值，尝试在下拉框中匹配
            var luggageValue = luggageInput.value.trim();
            if(luggageValue) {
                for(var i = 0; i < luggageSelect.options.length; i++) {
                    if(luggageSelect.options[i].value === luggageValue) {
                        luggageSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }
    });
    
    function updateLuggageInput(value) {
        document.getElementById('luggage').value = value;
    }
    
    function copyOutputText() {
        var outputTextarea = document.getElementById('output_text');
        outputTextarea.select();
        document.execCommand('copy');
        alert('内容已复制到剪贴板');
    }
</script>
{% endblock %}
