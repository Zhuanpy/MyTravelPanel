{% extends "staff/base.html" %}

{% block title %}机票签名 - MyTravelPanel{% endblock %}

{% block page_title %}机票签名{% endblock %}

{% block extra_css %}
<style>
    .signature-container {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .signature-title {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    .signature-canvas-container {
        display: flex;
        justify-content: center;
        margin: 20px 0;
    }

    #signatureCanvas {
        border: 1px solid #ccc;
        background: #fff;
    }

    .signature-controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
    }

    .signature-btn {
        padding: 8px 16px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s;
    }

    .signature-btn:hover {
        background: #357abd;
    }

    .signature-options {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 20px 0;
    }

    .signature-option {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .signature-option label {
        font-size: 14px;
        color: #666;
    }

    .signature-option input {
        width: 60px;
        padding: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block content %}
<div class="signature-container">
    <h1 class="signature-title">签名生成器</h1>
    
    <div class="signature-options">
        <div class="signature-option">
            <label>字体大小:</label>
            <input type="number" id="fontSize" value="60" min="20" max="120">
        </div>
        <div class="signature-option">
            <label>字体颜色:</label>
            <input type="color" id="fontColor" value="#000000">
        </div>
    </div>

    <div class="signature-canvas-container">
        <canvas id="signatureCanvas" width="600" height="200"></canvas>
    </div>

    <div class="signature-controls">
        <button class="signature-btn" onclick="generateSignature()">生成签名</button>
        <button class="signature-btn" onclick="downloadSignature()">下载签名</button>
        <button class="signature-btn" onclick="clearCanvas()">清除</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    const signature = "ANG GEOK CHYE";

    function generateSignature() {
        // 清除画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 设置字体样式
        const fontSize = document.getElementById('fontSize').value;
        const fontColor = document.getElementById('fontColor').value;
        
        ctx.font = `bold ${fontSize}px 'Arial'`;
        ctx.fillStyle = fontColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // 计算文字位置使其居中
        const x = canvas.width / 2;
        const y = canvas.height / 2;
        
        // 绘制文字
        ctx.fillText(signature, x, y);
    }

    function downloadSignature() {
        // 创建下载链接
        const link = document.createElement('a');
        link.download = 'signature.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 页面加载时生成签名
    document.addEventListener('DOMContentLoaded', function() {
        generateSignature();
        
        // 添加字体大小和颜色变化的监听器
        document.getElementById('fontSize').addEventListener('change', generateSignature);
        document.getElementById('fontColor').addEventListener('change', generateSignature);
    });
</script>
{% endblock %}
