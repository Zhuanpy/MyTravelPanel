{% extends "base.html" %}

{% block title %}创建项目REF{% endblock %}

{% block head %}
<style>
    .header-section {
        background-color: #FFFF99;
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
    }
    
    .header-row {
        display: grid;
        grid-template-columns: 120px 1fr;
        margin-bottom: 8px;
        align-items: center;
    }
    
    .header-label {
        font-weight: normal;
        color: #333;
    }
    
    .detail-section {
        margin-top: 20px;
        border: 1px solid #ddd;
    }
    
    .detail-table {
        width: 100%;
        border-collapse: collapse;
    }
    
    .detail-table th {
        background-color: #f5f5f5;
        padding: 8px;
        border: 1px solid #ddd;
        text-align: center;
    }
    
    .detail-table td {
        padding: 8px;
        border: 1px solid #ddd;
    }
    
    .action-buttons {
        margin-top: 10px;
        text-align: center;
    }
    
    .action-button {
        margin: 0 5px;
        padding: 5px 15px;
        border: 1px solid #ddd;
        background-color: #f5f5f5;
        cursor: pointer;
    }
    
    input[readonly] {
        background-color: #f5f5f5;
        border: 1px solid #ddd;
    }
    
    .eo-section {
        margin-top: 5px;
        padding: 10px;
        background-color: #f8f9fa;
        border: 1px solid #ddd;
    }
    
    .eo-button {
        padding: 2px 8px;
        font-size: 12px;
        background-color: #e9ecef;
        border: 1px solid #ced4da;
        border-radius: 3px;
        cursor: pointer;
        margin-left: 5px;
    }
    
    .eo-details {
        display: none;
        margin-top: 5px;
        padding: 8px;
        background-color: #fff;
        border: 1px solid #ddd;
    }
    
    .eo-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 5px;
        align-items: center;
    }
    
    .ref-cell {
        position: relative;
    }
    
    .eo-list {
        margin-top: 5px;
    }
    
    .eo-item {
        padding: 3px;
        margin: 2px 0;
        background-color: #f0f0f0;
        border-radius: 3px;
        font-size: 12px;
    }

    .section-title {
        font-weight: bold;
        margin: 15px 0 10px 0;
        padding-bottom: 5px;
        border-bottom: 1px solid #ddd;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Header Section -->
    <div class="header-section">
        <div class="section-title">项目信息</div>
        <div class="header-row">
            <span class="header-label">HID编号:</span>
            <input type="text" class="form-control" name="hid" readonly value="{{ project.hid }}">
        </div>
        <div class="header-row">
            <span class="header-label">项目名称:</span>
            <input type="text" class="form-control" readonly value="{{ project.project_name }}">
        </div>
        <div class="header-row">
            <span class="header-label">客户名称:</span>
            <input type="text" class="form-control" readonly value="{{ project.client_name }}">
        </div>
    </div>

    <!-- Detail Section -->
    <div class="detail-section">
        <table class="detail-table">
            <thead>
                <tr>
                    <th>序号</th>
                    <th>REF编号</th>
                    <th>REF名称</th>
                    <th>类型</th>
                    <th>描述</th>
                    <th>供应商</th>
                    <th>供应商联系人</th>
                    <th>供应商电话</th>
                    <th>销售价格</th>
                    <th>成本价格</th>
                    <th>货币</th>
                    <th>预计交付日期</th>
                    <th>状态</th>
                    <th>支付状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="detailTableBody">
                <!-- Dynamic rows will be added here -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="8" style="text-align: right;"><strong>总计:</strong></td>
                    <td id="totalSelling">0.00</td>
                    <td id="totalCost">0.00</td>
                    <td colspan="5"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="action-button" onclick="addNewRow()">添加REF</button>
        <button class="action-button" onclick="saveRefs()">保存REF</button>
    </div>
</div>

<script>
let rowCounter = 0;
let eoCounter = 0;

function addNewRow() {
    rowCounter++;
    const tbody = document.getElementById('detailTableBody');
    const row = document.createElement('tr');
    
    row.innerHTML = `
        <td>${rowCounter}</td>
        <td class="ref-cell">
            <input type="text" class="form-control" name="ref_number[]" readonly>
            <button type="button" class="eo-button" onclick="addEO(this)">添加EO</button>
            <div class="eo-list"></div>
        </td>
        <td><input type="text" class="form-control" name="ref_name[]"></td>
        <td>
            <select class="form-control" name="ref_type_id[]" required>
                <option value="">选择类型</option>
                {% for type in business_types %}
                <option value="{{ type.id }}">{{ type.name }}</option>
                {% endfor %}
            </select>
        </td>
        <td><input type="text" class="form-control" name="ref_description[]" required></td>
        <td>
            <select class="form-control" name="supplier_id[]" required>
                <option value="">选择供应商</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                {% endfor %}
            </select>
        </td>
        <td><input type="text" class="form-control" name="supplier_contact[]"></td>
        <td><input type="text" class="form-control" name="supplier_phone[]"></td>
        <td><input type="number" step="0.01" class="form-control selling-input" name="selling_price[]" value="0" onchange="updateTotals(this)"></td>
        <td><input type="number" step="0.01" class="form-control cost-input" name="cost_price[]" value="0" onchange="updateTotals(this)"></td>
        <td>
            <select class="form-control" name="currency[]">
                <option value="SGD">SGD</option>
                <option value="CNY">CNY</option>
                <option value="USD">USD</option>
            </select>
        </td>
        <td><input type="date" class="form-control" name="expected_delivery_date[]"></td>
        <td>
            <select class="form-control" name="ref_status[]">
                <option value="draft">草稿</option>
                <option value="processing">处理中</option>
                <option value="completed">已完成</option>
                <option value="cancelled">已取消</option>
            </select>
        </td>
        <td>
            <select class="form-control" name="ref_payment_status[]">
                <option value="unpaid">未支付</option>
                <option value="partial">部分支付</option>
                <option value="paid">已支付</option>
                <option value="refunded">已退款</option>
            </select>
        </td>
        <td>
            <button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">删除</button>
        </td>
    `;
    
    tbody.appendChild(row);
}

function removeRow(button) {
    const row = button.closest('tr');
    row.remove();
    updateTotals();
}

function updateTotals(input) {
    const row = input.closest('tr');
    const selling = parseFloat(row.querySelector('.selling-input').value) || 0;
    const cost = parseFloat(row.querySelector('.cost-input').value) || 0;
    
    // Update all totals
    const allRows = document.getElementById('detailTableBody').getElementsByTagName('tr');
    let totalSelling = 0;
    let totalCost = 0;
    
    Array.from(allRows).forEach(row => {
        totalSelling += parseFloat(row.querySelector('.selling-input').value) || 0;
        totalCost += parseFloat(row.querySelector('.cost-input').value) || 0;
    });
    
    document.getElementById('totalSelling').textContent = totalSelling.toFixed(2);
    document.getElementById('totalCost').textContent = totalCost.toFixed(2);
}

function generateRefNumber() {
    const hid = document.querySelector('[name="hid"]').value;
    const refCount = document.querySelectorAll('.ref-section').length;
    return `${hid}-R${String(refCount).padStart(2, '0')}`;
}

function addEO(button) {
    const refCell = button.closest('.ref-cell');
    const refNumber = refCell.querySelector('[name="ref_number[]"]').value;
    const eoList = refCell.querySelector('.eo-list');
    
    // Generate EO number
    eoCounter++;
    const eoNumber = `${refNumber}-E${String(eoCounter).padStart(2, '0')}`;
    
    // Create EO element
    const eoDiv = document.createElement('div');
    eoDiv.className = 'eo-section';
    eoDiv.innerHTML = `
        <div class="eo-item">
            <span>${eoNumber}</span>
            <button type="button" class="btn btn-sm btn-link" onclick="toggleEODetails(this)">详情</button>
            <button type="button" class="btn btn-sm btn-danger" onclick="removeEO(this)">删除</button>
        </div>
        <div class="eo-details">
            <div class="eo-row">
                <input type="text" class="form-control form-control-sm" name="eo_name[]" placeholder="EO名称" required>
                <select class="form-control form-control-sm" name="eo_supplier_type[]" required>
                    <option value="">选择类型</option>
                    <option value="visa">签证</option>
                    <option value="flight">机票</option>
                    <option value="hotel">酒店</option>
                    <option value="transport">交通</option>
                    <option value="local_operator">地接</option>
                    <option value="other">其他</option>
                </select>
                <select class="form-control form-control-sm" name="eo_supplier_id[]" required>
                    <option value="">选择供应商</option>
                    {% for supplier in suppliers %}
                    <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                    {% endfor %}
                </select>
                <input type="number" step="0.01" class="form-control form-control-sm" name="eo_amount[]" placeholder="金额" required>
            </div>
            <div class="eo-row">
                <select class="form-control form-control-sm" name="eo_currency[]">
                    <option value="SGD">SGD</option>
                    <option value="CNY">CNY</option>
                    <option value="USD">USD</option>
                </select>
                <input type="text" class="form-control form-control-sm" name="eo_external_system[]" placeholder="外部系统">
                <input type="text" class="form-control form-control-sm" name="eo_external_status[]" placeholder="外部状态">
                <input type="text" class="form-control form-control-sm" name="eo_external_reference[]" placeholder="外部参考号">
            </div>
            <div class="eo-row">
                <select class="form-control form-control-sm" name="eo_status[]">
                    <option value="draft">草稿</option>
                    <option value="confirmed">已确认</option>
                    <option value="paid">已支付</option>
                    <option value="cancelled">已取消</option>
                </select>
                <input type="text" class="form-control form-control-sm" name="eo_remarks[]" placeholder="备注" style="grid-column: 2 / -1;">
            </div>
        </div>
    `;
    
    eoList.appendChild(eoDiv);
}

function toggleEODetails(button) {
    const eoSection = button.closest('.eo-section');
    const details = eoSection.querySelector('.eo-details');
    details.style.display = details.style.display === 'none' ? 'block' : 'none';
}

function removeEO(button) {
    const eoSection = button.closest('.eo-section');
    eoSection.remove();
}

function saveRefs() {
    const formData = new FormData();
    const hid = document.querySelector('[name="hid"]').value;
    
    // Add CSRF token
    formData.append('csrf_token', '{{ csrf_token() }}');
    
    // Add detail rows
    const rows = document.getElementById('detailTableBody').getElementsByTagName('tr');
    const row = rows[0]; // 只处理第一行
    
    // REF data
    const refTypeId = row.querySelector('[name="ref_type_id[]"]').value;
    console.log('REF Type ID:', refTypeId); // Debug log
    
    if (!refTypeId) {
        alert('请选择REF类型');
        return;
    }

    const supplierId = row.querySelector('[name="supplier_id[]"]').value;
    console.log('Supplier ID:', supplierId); // Debug log
    
    if (!supplierId) {
        alert('请选择供应商');
        return;
    }

    const description = row.querySelector('[name="ref_description[]"]').value;
    if (!description) {
        alert('请输入描述');
        return;
    }

    // 添加所有必要的字段
    formData.append('ref_type_id', refTypeId);
    formData.append('supplier_id', supplierId);
    formData.append('name', row.querySelector('[name="ref_name[]"]').value || '');
    formData.append('description', description);
    formData.append('supplier_contact', row.querySelector('[name="supplier_contact[]"]').value || '');
    formData.append('supplier_phone', row.querySelector('[name="supplier_phone[]"]').value || '');
    formData.append('selling_price', row.querySelector('[name="selling_price[]"]').value || '0');
    formData.append('cost_price', row.querySelector('[name="cost_price[]"]').value || '0');
    formData.append('currency', row.querySelector('[name="currency[]"]').value);
    formData.append('expected_delivery_date', row.querySelector('[name="expected_delivery_date[]"]').value || '');
    formData.append('status', row.querySelector('[name="ref_status[]"]').value);
    formData.append('payment_status', row.querySelector('[name="ref_payment_status[]"]').value);
    formData.append('remarks', row.querySelector('[name="remarks[]"]').value || '');
    
    // Debug log
    console.log('Form Data:');
    for (let pair of formData.entries()) {
        console.log(pair[0] + ': ' + pair[1]);
    }
    
    // Submit form
    fetch(`/projects/${hid}/add_ref`, {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token() }}',
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => {
        console.log('Response status:', response.status); // Debug log
        return response.json();
    })
    .then(data => {
        console.log('Response data:', data); // Debug log
        if (data.success) {
            window.location.href = data.redirect || '/projects';
        } else {
            alert('保存失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败，请检查网络连接');
    });
}

// 初始化第一行
document.addEventListener('DOMContentLoaded', function() {
    addNewRow();
});
</script>
{% endblock %}
