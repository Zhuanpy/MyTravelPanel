{% extends "base.html" %}

{% block title %}创建项目{% endblock %}

{% block head %}
<style>
    .header-section {
        background-color: #FFFF99;
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
    }
    
    .header-row {
        display: grid;
        grid-template-columns: 120px 1fr;
        margin-bottom: 8px;
        align-items: center;
    }
    
    .header-label {
        font-weight: normal;
        color: #333;
    }
    
    .action-buttons {
        margin-top: 20px;
        text-align: center;
    }
    
    .action-button {
        margin: 0 5px;
        padding: 5px 15px;
        border: 1px solid #ddd;
        background-color: #f5f5f5;
        cursor: pointer;
    }
    
    input[readonly] {
        background-color: #f5f5f5;
        border: 1px solid #ddd;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Header Section -->
    <div class="header-section">
        <div class="header-row">
            <span class="header-label">HID编号:</span>
            <input type="text" class="form-control" name="hid" readonly value="{{ generated_hid }}">
        </div>
        <div class="header-row">
            <span class="header-label">项目名称:</span>
            <input type="text" class="form-control" name="project_name" required>
        </div>
        <div class="header-row">
            <span class="header-label">客户名称:</span>
            <input type="text" class="form-control" name="client_name" required>
        </div>
        <div class="header-row">
            <span class="header-label">创建日期:</span>
            <input type="text" class="form-control" value="{{ now.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
        </div>
        <div class="header-row">
            <span class="header-label">开始日期:</span>
            <input type="date" class="form-control" name="start_date" value="{{ now.strftime('%Y-%m-%d') }}" required onchange="updateEndDate()">
        </div>
        <div class="header-row">
            <span class="header-label">结束日期:</span>
            <input type="date" class="form-control" name="end_date" value="{{ now.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="header-row">
            <span class="header-label">状态:</span>
            <select class="form-control" name="project_status">
                <option value="draft">草稿</option>
                <option value="active">进行中</option>
                <option value="completed">已完成</option>
                <option value="cancelled">已取消</option>
            </select>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="action-button" onclick="saveProject()">创建项目</button>
    </div>
</div>

<script>
function updateEndDate() {
    const startDate = document.querySelector('[name="start_date"]').value;
    const endDateInput = document.querySelector('[name="end_date"]');
    if (startDate > endDateInput.value) {
        endDateInput.value = startDate;
    }
}

function saveProject() {
    const formData = new FormData();
    
    // Add header information
    formData.append('hid', document.querySelector('[name="hid"]').value);
    formData.append('project_name', document.querySelector('[name="project_name"]').value);
    formData.append('client_name', document.querySelector('[name="client_name"]').value);
    formData.append('project_status', document.querySelector('[name="project_status"]').value);
    formData.append('start_date', document.querySelector('[name="start_date"]').value);
    formData.append('end_date', document.querySelector('[name="end_date"]').value);
    
    // Submit form
    fetch('/projects/create', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Redirect to REF creation page
            window.location.href = `/projects/${data.hid}/create_ref`;
        } else {
            alert('保存失败: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败，请检查网络连接');
    });
}
</script>
{% endblock %}
