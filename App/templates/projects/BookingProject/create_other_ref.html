{% extends "base.html" %}
{% block title %}{% if ref %}编辑其他明细{% else %}新建其他明细{% endif %}{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">{% if ref %}编辑其他明细{% else %}新建其他明细{% endif %}</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        <!-- CSRF令牌 -->
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <!-- 基础字段 -->
                        <div class="row mb-4">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label>名称 <span class="text-danger">*</span></label>
                                    <input type="text" name="name" class="form-control" required 
                                           value="{{ ref.name if ref else '' }}">
                                    <div class="invalid-feedback">请输入名称</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>售价 (SGD)</label>
                                    <div class="input-group">
                                        <input type="number" name="selling_price" class="form-control" min="0" step="0.01" placeholder="0.00"
                                               value="{{ "%.2f"|format(ref.selling_price) if ref and ref.selling_price else '' }}">
                                        <span class="input-group-text">SGD</span>
                                    </div>
                                    <div class="invalid-feedback">请输入有效的售价</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>成本 (SGD)</label>
                                    <div class="input-group">
                                        <input type="number" name="cost_price" class="form-control" min="0" step="0.01" placeholder="0.00"
                                               value="{{ "%.2f"|format(ref.cost_price) if ref and ref.cost_price else '' }}">
                                        <span class="input-group-text">SGD</span>
                                    </div>
                                    <div class="invalid-feedback">请输入有效的成本价格</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>供应商</label>
                                    <select name="supplier_id" class="form-control">
                                        <option value="">请选择供应商</option>
                                        {% for supplier in suppliers %}
                                            <option value="{{ supplier.supplier_id }}" 
                                                    {% if ref and ref.supplier_id == supplier.supplier_id %}selected{% endif %}>
                                                {{ supplier.name }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>负责人姓名</label>
                                    <input type="text" name="leader_name" class="form-control" 
                                           placeholder="请输入负责人姓名"
                                           value="{{ ref.leader_name if ref else '' }}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>状态</label>
                                    <select name="status" class="form-control">
                                        <option value="draft" {% if ref and ref.status == 'draft' %}selected{% endif %}>草稿</option>
                                        <option value="processing" {% if ref and ref.status == 'processing' %}selected{% endif %}>处理中</option>
                                        <option value="completed" {% if ref and ref.status == 'completed' %}selected{% endif %}>已完成</option>
                                        <option value="cancelled" {% if ref and ref.status == 'cancelled' %}selected{% endif %}>已取消</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>出行日期</label>
                                    <input type="date" name="expected_delivery_date" class="form-control" max="2050-12-31"
                                           value="{{ ref.expected_delivery_date.strftime('%Y-%m-%d') if ref and ref.expected_delivery_date else '' }}">
                                    <div class="invalid-feedback">请选择有效的出行日期</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>结束日期</label>
                                    <input type="date" name="actual_delivery_date" class="form-control" max="2050-12-31"
                                           value="{{ ref.actual_delivery_date.strftime('%Y-%m-%d') if ref and ref.actual_delivery_date else '' }}">
                                    <div class="invalid-feedback">请选择有效的结束日期</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label>备注信息</label>
                                    <textarea name="remarks" class="form-control" rows="3" placeholder="请输入备注信息，如特殊要求、注意事项等">{{ ref.remarks if ref else '' }}</textarea>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mt-4">
                            <div class="col-12 text-center">
                                <button type="submit" class="btn btn-success btn-lg px-5">
                                    {% if ref %}更新{% else %}提交{% endif %}
                                </button>
                                <a href="javascript:history.back()" class="btn btn-secondary btn-lg px-5 ms-2">返回</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 表单校验和用户反馈
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    const inputs = form.querySelectorAll('input, select, textarea');
    
    // 实时校验函数
    function validateField(field) {
        const value = field.value.trim();
        const isValid = field.checkValidity();
        
        if (isValid) {
            field.classList.remove('is-invalid');
            field.classList.add('is-valid');
        } else {
            field.classList.remove('is-valid');
            field.classList.add('is-invalid');
        }
        
        return isValid;
    }
    
    // 日期校验函数
    function validateDates() {
        const expectedDate = document.querySelector('input[name="expected_delivery_date"]');
        const actualDate = document.querySelector('input[name="actual_delivery_date"]');
        
        // 检查日期范围
        if (expectedDate.value) {
            const expected = new Date(expectedDate.value);
            const maxDate = new Date('2050-12-31');
            
            if (expected > maxDate) {
                expectedDate.classList.remove('is-valid');
                expectedDate.classList.add('is-invalid');
                expectedDate.nextElementSibling.textContent = '出行日期不能超过2050年';
                return false;
            }
        }
        
        if (actualDate.value) {
            const actual = new Date(actualDate.value);
            const maxDate = new Date('2050-12-31');
            
            if (actual > maxDate) {
                actualDate.classList.remove('is-valid');
                actualDate.classList.add('is-invalid');
                actualDate.nextElementSibling.textContent = '结束日期不能超过2050年';
                return false;
            }
        }
        
        return true;
    }
    
    // 价格校验函数
    function validatePrices() {
        const sellingPrice = document.querySelector('input[name="selling_price"]');
        const costPrice = document.querySelector('input[name="cost_price"]');
        
        // 校验售价
        if (sellingPrice.value !== '') {
            const selling = parseFloat(sellingPrice.value);
            if (isNaN(selling) || selling < 0) {
                sellingPrice.classList.remove('is-valid');
                sellingPrice.classList.add('is-invalid');
                sellingPrice.nextElementSibling.textContent = '请输入有效的售价（支持0和小数）';
                return false;
            } else {
                sellingPrice.classList.remove('is-invalid');
                sellingPrice.classList.add('is-valid');
            }
        }
        
        // 校验成本
        if (costPrice.value !== '') {
            const cost = parseFloat(costPrice.value);
            if (isNaN(cost) || cost < 0) {
                costPrice.classList.remove('is-valid');
                costPrice.classList.add('is-invalid');
                costPrice.nextElementSibling.textContent = '请输入有效的成本（支持0和小数）';
                return false;
            } else {
                costPrice.classList.remove('is-invalid');
                costPrice.classList.add('is-valid');
            }
        }
        
        // 比较售价和成本
        if (sellingPrice.value && costPrice.value) {
            const selling = parseFloat(sellingPrice.value);
            const cost = parseFloat(costPrice.value);
            
            if (selling < cost) {
                sellingPrice.classList.remove('is-valid');
                sellingPrice.classList.add('is-invalid');
                sellingPrice.nextElementSibling.textContent = '售价不能低于成本价格';
                return false;
            } else {
                sellingPrice.classList.remove('is-invalid');
                sellingPrice.classList.add('is-valid');
                sellingPrice.nextElementSibling.textContent = '请输入有效的售价（支持0和小数）';
            }
        }
        return true;
    }
    
    // 为每个输入字段添加实时校验
    inputs.forEach(input => {
        input.addEventListener('blur', function() {
            validateField(this);
            
            // 特殊校验
            if (this.name === 'expected_delivery_date' || this.name === 'actual_delivery_date') {
                validateDates();
            }
            if (this.name === 'selling_price' || this.name === 'cost_price') {
                validatePrices();
            }
        });
        
        input.addEventListener('input', function() {
            if (this.classList.contains('is-invalid')) {
                validateField(this);
            }
        });
    });
    
    // 表单提交处理
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 清除之前的校验状态
        inputs.forEach(input => {
            input.classList.remove('is-valid', 'is-invalid');
        });
        
        // 校验所有字段
        let isValid = true;
        inputs.forEach(input => {
            if (!validateField(input)) {
                isValid = false;
            }
        });
        
        // 特殊校验
        if (!validateDates()) {
            isValid = false;
        }
        if (!validatePrices()) {
            isValid = false;
        }
        
        if (isValid) {
            // 显示提交中状态
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '提交中...';
            submitBtn.disabled = true;
            
            // 提交表单
            form.submit();
        } else {
            // 滚动到第一个错误字段
            const firstInvalid = form.querySelector('.is-invalid');
            if (firstInvalid) {
                firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                firstInvalid.focus();
            }
            
            // 显示错误提示
            showAlert('请检查表单中的错误信息', 'danger');
        }
    });
    
    // 显示提示信息
    function showAlert(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        form.insertBefore(alertDiv, form.firstChild);
        
        // 3秒后自动消失
        setTimeout(() => {
            if (alertDiv.parentNode) {
                alertDiv.remove();
            }
        }, 3000);
    }
    
    // 添加字段说明提示
    const tooltips = {
        'name': '请输入服务或产品的名称',
        'selling_price': '向客户收取的价格',
        'cost_price': '实际成本价格',
        'supplier_id': '选择提供此项服务的供应商',
        'status': '选择当前订单状态',
        'expected_delivery_date': '选择出行或开始日期',
        'actual_delivery_date': '选择结束或完成日期',
        'remarks': '可填写特殊要求、注意事项等'
    };
    
    // 为字段添加提示
    Object.keys(tooltips).forEach(fieldName => {
        const field = form.querySelector(`[name="${fieldName}"]`);
        if (field) {
            field.title = tooltips[fieldName];
        }
    });
});
</script>
{% endblock %}
