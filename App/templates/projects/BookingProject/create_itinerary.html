{% extends 'base.html' %}
{% block title %}添加行程{% endblock %}
{% block head %}
<style>
.tour-container {
    max-width: 600px;
    margin: 40px auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 36px 32px 28px 32px;
}
.tour-title {
    text-align: center;
    color: #4CAF50;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 32px;
}
.form-group {
    margin-bottom: 22px;
}
label {
    font-size: 15px;
    color: #333;
    margin-bottom: 7px;
    display: block;
    font-weight: 500;
}
input[type="text"], input[type="date"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ced4da;
    border-radius: 6px;
    font-size: 15px;
    background: #f9f9f9;
    transition: border-color 0.2s;
    box-sizing: border-box;
}
input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
    border-color: #4CAF50;
    outline: none;
    background: #fff;
}
.btn-success, .btn-secondary {
    padding: 10px 28px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin-right: 12px;
    margin-top: 8px;
    transition: background 0.2s, color 0.2s;
}
.btn-success {
    background: #4CAF50;
    color: #fff;
}
.btn-success:hover {
    background: #388e3c;
}
.btn-secondary {
    background: #e0e0e0;
    color: #333;
}
.btn-secondary:hover {
    background: #bdbdbd;
    color: #222;
}
@media (max-width: 700px) {
    .tour-container {
        padding: 18px 8px 16px 8px;
    }
}
</style>
{% endblock %}
{% block content %}
<div class="tour-container">
    <h2 class="tour-title">添加行程</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label>日期标题：</label>
            <input type="text" name="day_title" class="form-control" required>
        </div>
        <div class="form-group">
            <label>日期：</label>
            <input type="date" name="date" class="form-control" required>
        </div>
        <div class="form-group">
            <label>行程内容：</label>
            <textarea name="content" class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">添加行程</button>
        <a href="{{ url_for('tour_projects.edit_tour_group', group_id=group.id) }}" class="btn btn-secondary">返回团</a>
    </form>
</div>
{% endblock %}
