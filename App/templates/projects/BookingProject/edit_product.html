<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑旅游产品</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 40px auto;
        }
        .header-section {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: 500;
            color: #2c3e50;
        }
        .btn-submit {
            background-color: #3498db;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        .btn-cancel {
            background-color: #95a5a6;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="header-section">
        <div class="container">
            <h1 class="text-center">编辑旅游产品</h1>
        </div>
    </div>

    <div class="container">
        <div class="form-container">
            <form method="POST" action="{{ url_for('product_details.edit_product', id=product.id) }}">
                <div class="mb-3">
                    <label for="title" class="form-label">产品标题</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ product.title }}" required>
                </div>

                <div class="mb-3">
                    <label for="duration" class="form-label">行程时长</label>
                    <input type="text" class="form-control" id="duration" name="duration" value="{{ product.duration }}" placeholder="例如：3天2晚" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">价格</label>
                    <div class="input-group">
                        <span class="input-group-text">¥</span>
                        <input type="number" class="form-control" id="price" name="price" value="{{ product.price }}" step="0.01" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="itinerary" class="form-label">行程安排</label>
                    <textarea class="form-control" id="itinerary" name="itinerary" rows="5" required>{{ product.itinerary }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="included" class="form-label">费用包含</label>
                    <textarea class="form-control" id="included" name="included" rows="3" required>{{ product.included }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="not_included" class="form-label">费用不包含</label>
                    <textarea class="form-control" id="not_included" name="not_included" rows="3" required>{{ product.not_included }}</textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                        删除产品
                    </button>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('product_details.tour_product_details') }}" class="btn btn-cancel text-white">取消</a>
                        <button type="submit" class="btn btn-submit text-white">保存修改</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    确定要删除这个产品吗？此操作不可撤销。
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <form action="{{ url_for('product_details.delete_product', id=product.id) }}" method="POST" style="display: inline;">
                        <button type="submit" class="btn btn-danger">确认删除</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
