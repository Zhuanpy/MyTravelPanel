{% extends "base.html" %}
{% block title %}新建保险明细{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>新建保险明细</h2>
    <form method="post">
        <!-- CSRF令牌 -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- 基础字段 -->
        <div class="form-group">
            <label>编号</label>
            <input type="text" name="ref_number" class="form-control" required>
        </div>
        <div class="form-group">
            <label>名称</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>供应商</label>
            <select name="supplier_id" class="form-control">
                <option value="">请选择供应商</option>
                {% for supplier in suppliers %}
                    <option value="{{ supplier.supplier_id }}">{{ supplier.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>金额</label>
            <input type="number" name="selling_price" class="form-control">
        </div>
        <div class="form-group">
            <label>状态</label>
            <select name="status" class="form-control">
                <option value="draft">草稿</option>
                <option value="processing">处理中</option>
                <option value="completed">已完成</option>
                <option value="cancelled">已取消</option>
            </select>
        </div>
        <!-- 保险专属字段 -->
        <div class="form-group">
            <label>保险公司</label>
            <input type="text" name="insurance_company" class="form-control">
        </div>
        <div class="form-group">
            <label>保险类型</label>
            <input type="text" name="insurance_type" class="form-control">
        </div>
        <div class="form-group">
            <label>受保人</label>
            <input type="text" name="insured_person" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">提交</button>
    </form>
</div>
{% endblock %}
