{% extends "base.html" %}
{% block title %}新建保险明细{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>新建保险明细</h2>
    <form method="post">
        <!-- 基础字段 -->
        <div class="form-group">
            <label>编号</label>
            <input type="text" name="ref_number" class="form-control" required>
        </div>
        <div class="form-group">
            <label>名称</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>供应商</label>
            <input type="text" name="supplier" class="form-control">
        </div>
        <div class="form-group">
            <label>金额</label>
            <input type="number" name="selling_price" class="form-control">
        </div>
        <div class="form-group">
            <label>状态</label>
            <input type="text" name="status" class="form-control">
        </div>
        <!-- 保险专属字段 -->
        <div class="form-group">
            <label>保险公司</label>
            <input type="text" name="insurance_company" class="form-control">
        </div>
        <div class="form-group">
            <label>保险类型</label>
            <input type="text" name="insurance_type" class="form-control">
        </div>
        <div class="form-group">
            <label>受保人</label>
            <input type="text" name="insured_person" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">提交</button>
    </form>
</div>
{% endblock %}
