{% extends "staff/base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>{{ country }}所有配套信息</h1>
    </div>

    <div class="section-card">
        <div class="section-header">
            <h3>配套列表</h3>
        </div>
        
        <div class="button-group">
            {% for city in cities %}
            <a href="{{ url_for('package_routes.our_package', city_name=city.city_name) }}" 
               class="btn btn-purple">
               {{ city.display_name }}配套
            </a>
            {% endfor %}
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="{{ url_for('package_routes.index') }}" class="btn btn-blue">
            返回首页
        </a>
    </div>
</div>
{% endblock %}
