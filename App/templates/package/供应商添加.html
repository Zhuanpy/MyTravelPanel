{% extends "base.html" %}

{% block title %}添加供应商{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
<style>
    .supplier-add-container {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }
    .card {
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-radius: 8px;
    }
    .card-header {
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
    }
</style>
{% endblock %}

{% block content %}
<div class="container supplier-add-container">
    <div class="card">
        <div class="card-header">
            <h2 class="mb-0">添加供应商</h2>
        </div>
        <div class="card-body">
            <form action="{{ url_for('supplier.add_supplier') }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name" class="form-label">供应商名称 *</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="supplier_type" class="form-label">供应商类型 *</label>
                            <select id="supplier_type" name="supplier_type" class="form-select" required>
                                <option value="">请选择供应商类型</option>
                                <option value="visa">签证</option>
                                <option value="flight">机票</option>
                                <option value="hotel">酒店</option>
                                <option value="transport">用车</option>
                                <option value="local_operator">地接</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="contact_person" class="form-label">联系人</label>
                            <input type="text" id="contact_person" name="contact_person" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phone" class="form-label">联系电话</label>
                            <input type="tel" id="phone" name="phone" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email" class="form-label">电子邮箱</label>
                            <input type="email" id="email" name="email" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="status" class="form-label">状态</label>
                            <select id="status" name="status" class="form-select">
                                <option value="active">活跃</option>
                                <option value="inactive">非活跃</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="country" class="form-label">国家</label>
                            <input type="text" id="country" name="country" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="region" class="form-label">地区</label>
                            <input type="text" id="region" name="region" class="form-control">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-group">
                            <label for="address" class="form-label">地址</label>
                            <textarea id="address" name="address" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                <div class="mt-4 text-center">
                    <button type="submit" class="btn btn-primary">保存供应商</button>
                    <a href="{{ url_for('supplier.suppliers') }}" class="btn btn-secondary ms-2">返回列表</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
