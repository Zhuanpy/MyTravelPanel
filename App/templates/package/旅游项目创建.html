{% extends "base.html" %}

{% block title %}创建旅游项目{% endblock %}

{% block head %}
<style>
    .form-container {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 25px;
        width: 100%;
        max-width: 900px;
        margin: 40px auto;
        box-sizing: border-box;
    }

    h2 {
        text-align: center;
        color: #333333;
        margin-bottom: 25px;
    }

    .home-link {
        text-decoration: none;
        color: #007bff;
        font-size: 14px;
        display: inline-block;
        margin-bottom: 20px;
    }
    
    .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 15px;
    }
    
    .form-group {
        flex: 1;
        min-width: 250px;
    }

    label {
        font-size: 14px;
        color: #555555;
        display: block;
        margin-bottom: 5px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 3px rgba(0, 123, 255, 0.5);
    }
    
    textarea {
        width: 100%;
        min-height: 100px;
    }

    button {
        width: 100%;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background-color: #0056b3;
    }
    
    @media (max-width: 768px) {
        .form-row {
            flex-direction: column;
            gap: 10px;
        }
        
        .form-group {
            min-width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <!-- <a href="/" class="home-link">Home page</a> -->
    <h2>创建旅游项目</h2>
    <form id="tourForm" method="POST" action="{{url_for('package_routes.handle_tour_project')}}" onsubmit="validateForm(event)">
        <div class="form-row">
            <div class="form-group">
                <label for="projectName">项目名称:</label>
                <input type="text" id="projectName" name="projectName" placeholder="例如: 环游世界" required>
            </div>
            <div class="form-group">
                <label for="projectHID">项目HID (如有):</label>
                <input type="text" id="projectHID" name="projectHID" placeholder="例如: HID12345" optional>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="departureDate">出发日期:</label>
                <input type="text" id="departureDate" name="departureDate" placeholder="dd/mm/yyyy" required>
            </div>
            <div class="form-group">
                <label for="projectStatus">项目状态:</label>
                <select id="projectStatus" name="projectStatus" required>
                    <option value="处理中">处理中</option>
                    <option value="待出行">待出行</option>
                    <option value="已完成">已完成</option>
                    <option value="已完成">忽略单</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="contactPerson">联系人:</label>
                <input type="text" id="contactPerson" name="contactPerson" placeholder="例如: 张三" required>
            </div>
            <div class="form-group">
                <label for="contactInfo">联系方式:</label>
                <input type="text" id="contactInfo" name="contactInfo" placeholder="例如: 123456789" required>
            </div>
        </div>

        <div class="form-group">
            <label for="remarks">备注:</label>
            <textarea id="remarks" name="remarks" placeholder="填写备注信息" rows="4"></textarea>
        </div>

        <button type="submit">创建项目</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    function validateForm(event) {
        const departureDate = document.getElementById('departureDate').value;
        const datePattern = /^\d{2}\/\d{2}\/\d{4}$/;

        if (!departureDate || !datePattern.test(departureDate)) {
            event.preventDefault();
            alert('请按照 dd/mm/yyyy 格式填写有效的出发日期。');
            return;
        }

        const [day, month, year] = departureDate.split('/').map(Number);
        const date = new Date(`${year}-${month}-${day}`);

        if (isNaN(date.getTime()) || date.getDate() !== day || date.getMonth() + 1 !== month || date.getFullYear() !== year) {
            event.preventDefault();
            alert('请填写有效的出发日期。');
        }
    }
</script>
{% endblock %}
