{% extends "public/base.html" %}

{% block title %}页面未找到 - MyTravelPanel{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
            </div>
            
            <h1 class="display-1 fw-bold text-muted">404</h1>
            <h2 class="mb-4">页面未找到</h2>
            
            {% if message %}
            <p class="text-muted mb-4">{{ message }}</p>
            {% else %}
            <p class="text-muted mb-4">抱歉，您访问的页面不存在或已被移除。</p>
            {% endif %}
            
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('public.index') }}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>返回首页
                </a>
                <a href="{{ url_for('public.visa_services') }}" class="btn btn-outline-primary">
                    <i class="fas fa-passport me-2"></i>签证服务
                </a>
                <a href="{{ url_for('public.tour_packages') }}" class="btn btn-outline-primary">
                    <i class="fas fa-map-marked-alt me-2"></i>旅游配套
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
