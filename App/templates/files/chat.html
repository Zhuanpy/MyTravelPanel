<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        #chat-box {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .message {
            padding: 5px;
            margin: 5px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #f1f1f1;
        }
        .ai-message {
            background-color: #d1e7ff;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>DeepSeek Chat</h2>
        <div id="chat-box" class="mb-3"></div>
        <div class="input-group">
            <input type="text" id="user-input" class="form-control" placeholder="Type a message..." autocomplete="off">
            <div class="input-group-append">
                <button class="btn btn-primary" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#send-btn').click(function () {
                var userMessage = $('#user-input').val();
                if (userMessage.trim() === "") {
                    return;
                }

                // 显示用户消息
                $('#chat-box').append('<div class="message user-message"><strong>You:</strong> ' + userMessage + '</div>');

                // 清空输入框
                $('#user-input').val('');

                // 发送请求到后台
                $.ajax({
                    url: '/deepseek/chat',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ message: userMessage }),
                    success: function (response) {
                        var aiMessage = response.message || "Sorry, I couldn't get a response.";
                        $('#chat-box').append('<div class="message ai-message"><strong>AI:</strong> ' + aiMessage + '</div>');
                        $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);  // 滚动到最新消息
                    },
                    error: function (error) {
                        $('#chat-box').append('<div class="message ai-message"><strong>AI:</strong> Error occurred.</div>');
                    }
                });
            });

            // 按下 Enter 键也能发送消息
            $('#user-input').keypress(function (e) {
                if (e.which === 13) {  // 13 是 Enter 键的代码
                    $('#send-btn').click();
                }
            });
        });
    </script>
</body>
</html>
