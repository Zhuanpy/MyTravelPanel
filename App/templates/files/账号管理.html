<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}">
    <script src="{{ url_for('static', filename='Js/account.js') }}"></script>
</head>
<body>
    <div class="container">
        <div class="home-link">
            <a href="/">返回首页</a>
        </div>
        
        <h1>账号管理系统</h1>

        <!-- 添加账号按钮 -->
        <div class="section-header">
            <div class="header-actions">
                <a href="{{ url_for('account_routes.add_account_page') }}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> 添加新账号
                </a>
            </div>
        </div>

        <!-- 账号列表部分 -->
        <div class="section-header">
            <h2>账号列表</h2>
            <div class="search-box">
                <input type="text" class="form-control" id="searchInput" placeholder="搜索账号...">
            </div>
        </div>

        <!-- 筛选选项 -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label>类别：</label>
                    <div class="category-filter" id="categoryFilter">
                    </div>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <label>国家：</label>
                    <div class="country-filter" id="countryFilter">
                    </div>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <label>账户归属：</label>
                    <div class="owner-filter" id="ownerFilter">
                    </div>
                </div>
            </div>
        </div>

        <div class="account-table-wrapper">
            <table class="account-table">
                <thead>
                    <tr>
                        <th>平台/网址</th>
                        <th>类别</th>
                        <th>账户归属</th>
                        <th>用户名</th>
                        <th>密码</th>
                        <th>国家/地区</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="accountList">
                    <!-- 账号列表将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>

        <!-- 分页控件 -->
        <div class="pagination-container">
            <div class="pagination-info">
                共 <span id="totalItems">0</span> 条记录，每页 <span>10</span> 条
            </div>
            <div class="pagination" id="pagination">
                <button class="btn-page" onclick="changePage('prev')">&lt;</button>
                <div id="pageNumbers"></div>
                <button class="btn-page" onclick="changePage('next')">&gt;</button>
            </div>
        </div>
    </div>

    <!-- 编辑账号模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="section-header">
                <h2>编辑账号</h2>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editPlatform">平台</label>
                        <input type="text" class="form-control" id="editPlatform" required>
                    </div>
                    <div class="form-group">
                        <label for="editWebsiteUrl">网址</label>
                        <input type="url" class="form-control" id="editWebsiteUrl" placeholder="https://">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editCategory">类别</label>
                        <select class="form-control" id="editCategory" required>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editOwner">账户归属</label>
                        <input type="text" class="form-control" id="editOwner" placeholder="账户所有者/部门">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editUsername">用户名</label>
                        <input type="text" class="form-control" id="editUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="editPassword">密码</label>
                        <input type="password" class="form-control" id="editPassword">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editCountry">国家</label>
                        <input type="text" class="form-control" id="editCountry">
                    </div>
                    <div class="form-group">
                        <label for="editRegion">地区</label>
                        <input type="text" class="form-control" id="editRegion">
                    </div>
                </div>

                <div class="form-group">
                    <label for="editDescription">详细介绍</label>
                    <textarea class="form-control" id="editDescription" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="editNotes">备注</label>
                    <textarea class="form-control" id="editNotes" rows="2"></textarea>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn" onclick="submitEditForm()">保存修改</button>
                    <button type="button" class="btn btn-warning" onclick="closeEditModal()">取消</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
