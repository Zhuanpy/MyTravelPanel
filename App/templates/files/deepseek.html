<!DOCTYPE html>
<html>
<head>
    <title>DeepSeek对话窗口</title>
    <style>
        .chat-container {
            width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .chat-box {
            height: 500px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin: 5px 10px;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 60%;
            white-space: pre-wrap; /* 允许换行 */
            word-break: break-word; /* 防止长单词溢出 */
            text-align: left; /* 让文本内容靠左 */
        }
        .user-message {
            background-color: #e3f2fd;
            align-self: flex-end; /* 用户消息整体靠右 */
        }
        .bot-message {
            background-color: #f5f5f5;
            align-self: flex-start; /* AI 消息靠左 */
        }
        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        textarea {
            width: 90%;
            padding: 8px;
            resize: none;
            height: 60px;
        }
        button {
            padding: 8px 15px;
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>DeepSeek对话窗口</h1>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <textarea id="userInput" placeholder="输入你的消息，按 Ctrl+Enter 发送"></textarea>
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>
    <script>
        function appendMessage(message, isUser) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.textContent = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // 滚动到底部
        }

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message) return;
            
            appendMessage(message, true);
            userInput.value = '';
            userInput.style.height = "60px"; // 发送后恢复默认高度
            
            try {
                const response = await fetch('/deepseek/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    appendMessage(data.reply, false);
                } else {
                    appendMessage('抱歉，请求处理失败', false);
                }
            } catch (error) {
                appendMessage('网络错误，请稍后再试', false);
            }
        }

        // 监听回车事件：Enter 换行，Ctrl+Enter 发送
        document.getElementById('userInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.ctrlKey) {
                    sendMessage();
                    e.preventDefault();  // 阻止换行
                }
            }
        });

        // 自动调整输入框高度
        document.getElementById('userInput').addEventListener('input', function () {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

    </script>
</body>
</html>
