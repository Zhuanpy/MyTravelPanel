<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店编辑测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>酒店编辑功能测试</h2>
        <p>这个页面用于测试酒店REF编辑功能是否正常工作。</p>
        
        <div class="alert alert-info">
            <h5>测试步骤：</h5>
            <ol>
                <li>创建一个酒店REF</li>
                <li>编辑该酒店REF</li>
                <li>检查表单是否正确显示</li>
                <li>检查保存功能是否正常</li>
            </ol>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>创建酒店REF</h5>
                    </div>
                    <div class="card-body">
                        <a href="/projects/ref/create_hotel/1" class="btn btn-primary">创建新酒店REF</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>编辑酒店REF</h5>
                    </div>
                    <div class="card-body">
                        <p>请先创建一个酒店REF，然后点击编辑按钮进行测试。</p>
                        <a href="/projects/ref/1/edit" class="btn btn-warning">编辑酒店REF (ID: 1)</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <h5>常见问题排查：</h5>
            <ul>
                <li><strong>表单不显示：</strong>检查路由是否正确</li>
                <li><strong>字段验证失败：</strong>检查JavaScript是否正确加载</li>
                <li><strong>保存失败：</strong>检查后端路由是否正确处理POST请求</li>
                <li><strong>价格字段问题：</strong>检查Flask-WTF表单字段名称</li>
            </ul>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
