# Nginx site configuration for MyTravelPanel
# This file should be placed at: /etc/nginx/sites-available/mytravelpanel
# Then create a symlink: ln -s /etc/nginx/sites-available/mytravelpanel /etc/nginx/sites-enabled/mytravelpanel

server {
    listen 80;
    server_name joyesc.com www.joyesc.com;
    
    # Redirect HTTP to HTTPS (if SSL is configured)
    # return 301 https://$server_name$request_uri;
    
    # Or serve directly on HTTP
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Static files (if serving directly from nginx)
    location /static {
        alias /var/www/MyTravelPanel/App_new/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Upload files
    location /uploads {
        alias /var/www/MyTravelPanel/uploads;
        expires 7d;
    }
    
    # Logging
    access_log /var/log/nginx/mytravelpanel_access.log;
    error_log /var/log/nginx/mytravelpanel_error.log;
}
