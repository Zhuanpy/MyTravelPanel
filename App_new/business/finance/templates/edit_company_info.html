<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑公司信息</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
        }
        .edit-form {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 30px 0;
        }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
        }
        .preview-image {
            max-width: 200px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="edit-form">
                    <h2 class="text-center mb-4">编辑公司信息</h2>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="company_name" class="form-label">公司名称</label>
                            <input type="text" class="form-control" id="company_name" name="company_name" 
                                   value="{{ company.company_name if company else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="company_description" class="form-label">公司简介</label>
                            <textarea class="form-control" id="company_description" name="company_description" 
                                      rows="3" required>{{ company.company_description if company else '' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="phone" class="form-label">联系电话</label>
                            <input type="text" class="form-control" id="phone" name="phone" 
                                   value="{{ company.phone if company else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">电子邮箱</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ company.email if company else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="address" class="form-label">公司地址</label>
                            <textarea class="form-control" id="address" name="address" 
                                      rows="2" required>{{ company.address if company else '' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="logo" class="form-label">公司Logo</label>
                            <input type="file" class="form-control" id="logo" name="logo" accept="image/*">
                            {% if company and company.logo_path %}
                            <img src="{{ url_for('static', filename=company.logo_path.replace('static/', '')) }}" 
                                 alt="Company Logo" class="preview-image">
                            {% endif %}
                        </div>
                        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">保存更改</button>
                            <a href="{{ url_for('product_details.tour_product_details') }}" class="btn btn-secondary ms-2">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
