<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>员工登录 - MyTravel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.9;
            z-index: 10;
        }

        /* 主容器 */
        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 24px 40px;
        }

        /* Logo 区域 */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .login-icon i {
            font-size: 32px;
            color: #10b981;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
        }

        /* 登录卡片 */
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        /* 提示消息 */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-label i {
            margin-right: 6px;
            color: #9ca3af;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        /* 记住我 */
        .remember-row {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-input {
            width: 20px;
            height: 20px;
            accent-color: #10b981;
        }

        .checkbox-label {
            font-size: 14px;
            color: #4b5563;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* 其他入口 */
        .other-options {
            margin-top: 24px;
            text-align: center;
        }

        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 12px;
            font-size: 12px;
            color: #9ca3af;
        }

        .staff-login-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* 页脚 */
        .login-footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        .login-footer a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

<a href="{{ url_for('mobile.public_home') }}" class="back-btn">
    <i class="fas fa-arrow-left"></i> 返回首页
</a>

<div class="login-container">
    <div class="login-header">
        <div class="login-icon">
            <i class="fas fa-user-tie"></i>
        </div>
        <h1 class="login-title">员工登录</h1>
        <p class="login-subtitle">MyTravel 内部管理系统</p>
    </div>

    <div class="login-card">
        <!-- 显示消息 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}">
                    <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-envelope"></i>邮箱
                </label>
                <input type="email" name="email" class="form-input"
                       placeholder="请输入邮箱" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i>密码
                </label>
                <input type="password" name="password" class="form-input"
                       placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <div class="remember-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox" name="remember" value="1" class="checkbox-input">
                    <span class="checkbox-label">记住我</span>
                </label>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i>
                登录
            </button>
        </form>

        <div class="other-options">
            <div class="divider">
                <span>其他选项</span>
            </div>
            <a href="{{ url_for('auth_profile.staff_register') }}" class="staff-login-link">
                <i class="fas fa-user-plus"></i>
                员工注册
            </a>
        </div>
    </div>
</div>

<div class="login-footer">
    <p>&copy; 2026 MyTravel. All rights reserved.</p>
</div>

</body>
</html>
