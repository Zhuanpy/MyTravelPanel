{% extends "mobile/mobile_base.html" %}

{% block title %}{{ title }} - MyTravel{% endblock %}

{% block header_left %}
<a href="javascript:history.back()" style="color: white; font-size: 20px; margin-right: 12px;">
    <i class="fas fa-arrow-left"></i>
</a>
<span>{{ title }}</span>
{% endblock %}

{% block content %}
<div class="mobile-card">
    <div class="coming-soon-notice">
        <div class="notice-icon">
            <i class="fas fa-rocket"></i>
        </div>
        <h3 class="notice-title">{{ title }}</h3>
        <p class="notice-message">{{ message }}</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <span class="progress-text">开发中...</span>
    </div>
</div>

<div class="back-section">
    <a href="{{ url_for('mobile.index') }}" class="mobile-btn mobile-btn-primary mobile-btn-block">
        <i class="fas fa-home" style="margin-right: 8px;"></i>
        返回首页
    </a>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .coming-soon-notice {
        text-align: center;
        padding: 32px 16px;
    }

    .notice-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f3e8ff, #dbeafe);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: #9333ea;
        animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .notice-title {
        font-size: 20px;
        font-weight: 600;
        color: #333;
        margin: 0 0 12px 0;
    }

    .notice-message {
        font-size: 15px;
        color: #666;
        line-height: 1.6;
        margin: 0 0 24px 0;
    }

    .progress-bar {
        width: 200px;
        height: 6px;
        background: #e5e7eb;
        border-radius: 3px;
        margin: 0 auto 12px;
        overflow: hidden;
    }

    .progress-fill {
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, #198754, #20c997);
        border-radius: 3px;
        animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
        0% { width: 30%; }
        50% { width: 70%; }
        100% { width: 30%; }
    }

    .progress-text {
        font-size: 13px;
        color: #999;
    }

    .back-section {
        padding: 16px;
    }
</style>
{% endblock %}
