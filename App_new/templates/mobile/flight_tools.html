{% extends "mobile/mobile_base.html" %}

{% block title %}机票工具 - MyTravel{% endblock %}
{% block header_title %}机票工具{% endblock %}

{% block content %}
<!-- 主要工具 -->
<div style="display: flex; flex-direction: row; gap: 10px; margin-bottom: 10px;">
    <a href="{{ url_for('mobile.flight_conversion') }}" class="tool-card" style="flex: 1; text-align: center;">
        <div class="tool-icon-lg" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); margin: 0 auto 8px;">
            <i class="fas fa-exchange-alt"></i>
        </div>
        <div class="tool-name">行程转换</div>
        <div class="tool-desc">格式化航班行程</div>
    </a>
    <a href="{{ url_for('mobile.athina_code') }}" class="tool-card" style="flex: 1; text-align: center;">
        <div class="tool-icon-lg" style="background: linear-gradient(135deg, #10b981, #059669); margin: 0 auto 8px;">
            <i class="fas fa-code"></i>
        </div>
        <div class="tool-name">ATHINA</div>
        <div class="tool-desc">生成预订代码</div>
    </a>
</div>

<!-- 创建订单 -->
<a href="{{ url_for('mobile.flight_order_create') }}" class="tool-card-wide">
    <div class="tool-icon-lg" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
        <i class="fas fa-plus-circle"></i>
    </div>
    <div class="tool-info">
        <div class="tool-name">快速创建订单</div>
        <div class="tool-desc">创建机票订单</div>
    </div>
    <i class="fas fa-chevron-right" style="color: #ccc;"></i>
</a>

<!-- 桌面版入口 -->
<a href="{{ url_for('flights_athina.athina_conversion') }}?desktop=true" class="desktop-link">
    <i class="fas fa-laptop"></i>
    <span>使用完整版（电脑端）</span>
    <i class="fas fa-external-link-alt"></i>
</a>
{% endblock %}

{% block extra_css %}
<style>
    .tool-card {
        display: block;
        background: white;
        border-radius: 12px;
        padding: 16px 12px;
        text-align: center;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tool-card:active {
        background: #f9f9f9;
    }

    .tool-card-wide {
        display: flex;
        align-items: center;
        gap: 12px;
        background: white;
        border-radius: 12px;
        padding: 14px 16px;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        margin-bottom: 10px;
    }

    .tool-card-wide:active {
        background: #f9f9f9;
    }

    .tool-card-wide .tool-info {
        flex: 1;
    }

    .tool-icon-lg {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: white;
    }

    .tool-name {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 2px;
    }

    .tool-desc {
        font-size: 11px;
        color: #888;
    }

    .desktop-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 16px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 10px;
        text-decoration: none;
        color: #666;
        font-size: 13px;
    }

    .desktop-link:active {
        background: #e9ecef;
    }
</style>
{% endblock %}
