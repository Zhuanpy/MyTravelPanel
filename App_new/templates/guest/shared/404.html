{% extends "guest/shared/base.html" %}

{% block title %}页面未找到 - MyTravelPanel{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="py-5">
                    <i class="fas fa-exclamation-triangle text-warning" style="font-size: 6rem;"></i>
                    <h1 class="display-4 mt-4">页面未找到</h1>
                    <p class="lead text-muted">{{ message or '抱歉，您访问的页面不存在或已被移动。' }}</p>
                    <div class="mt-4">
                        <a href="{{ url_for('public.index') }}" class="btn btn-custom btn-lg me-3">
                            <i class="fas fa-home"></i> 返回首页
                        </a>
                        <a href="{{ url_for('public.contact') }}" class="btn btn-outline-primary btn-lg">
                            <i class="fas fa-envelope"></i> 联系我们
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
