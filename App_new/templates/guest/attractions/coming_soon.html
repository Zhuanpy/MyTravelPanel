{% extends "guest/shared/base.html" %}

{% block title %}景点门票 - 即将推出{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="py-5">
                    <div class="mb-4">
                        <i class="fas fa-ticket-alt text-primary" style="font-size: 5rem; opacity: 0.8;"></i>
                    </div>
                    <h1 class="display-5 fw-bold mb-3">景点门票</h1>
                    <p class="lead text-muted mb-4">
                        精彩即将呈现！我们正在为您准备全球热门景点的门票预订服务。
                    </p>
                    <div class="bg-light rounded-3 p-4 mb-4">
                        <h5 class="fw-bold mb-3"><i class="fas fa-star text-warning me-2"></i>即将上线</h5>
                        <div class="row g-3 text-start">
                            <div class="col-md-6">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-check-circle text-success me-2"></i>
                                    <span>新加坡环球影城</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-check-circle text-success me-2"></i>
                                    <span>滨海湾花园</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-check-circle text-success me-2"></i>
                                    <span>圣淘沙缆车</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-check-circle text-success me-2"></i>
                                    <span>夜间野生动物园</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-check-circle text-success me-2"></i>
                                    <span>更多热门景点...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="text-muted mb-4">
                        如需门票预订服务，欢迎直接联系我们的客服人员
                    </p>
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a href="{{ url_for('public.tour_packages') }}" class="btn btn-primary btn-lg">
                            <i class="fas fa-map-marked-alt me-2"></i>浏览旅游配套
                        </a>
                        <a href="{{ url_for('public.contact') }}" class="btn btn-outline-primary btn-lg">
                            <i class="fas fa-phone me-2"></i>联系我们
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
