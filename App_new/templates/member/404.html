{% extends "member/base.html" %}

{% block title %}页面未找到 - MyTravelPanel{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center py-5">
            <i class="fas fa-exclamation-triangle text-warning" style="font-size: 6rem;"></i>
            <h1 class="display-4 mt-4">页面未找到</h1>
            <p class="lead text-muted">{{ message or '抱歉，您访问的页面不存在或暂时不可用。' }}</p>
            <div class="mt-4">
                <a href="{{ url_for('member.dashboard') }}" class="btn btn-primary btn-lg me-3">
                    <i class="fas fa-home"></i> 返回仪表板
                </a>
                <a href="{{ url_for('guest.main.contact') }}" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-envelope"></i> 联系客服
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
