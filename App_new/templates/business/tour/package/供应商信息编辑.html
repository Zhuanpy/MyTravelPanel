{% extends "staff_base.html" %}

{% block title %}编辑供应商 - MyTravelPanel{% endblock %}

{% block page_title %}编辑供应商{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
<style>
    .supplier-edit-container {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }
    .card {
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-radius: 8px;
    }
    .card-header {
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
    }
</style>
{% endblock %}

{% block content %}
<div class="container supplier-edit-container">
    <div class="card">
        <div class="card-header">
            <h2 class="mb-0">编辑供应商</h2>
        </div>
        <div class="card-body">
            <form action="{{ url_for('supplier.edit_supplier', supplier_id=supplier.supplier_id) }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name" class="form-label">供应商名称 *</label>
                            <input type="text" id="name" name="name" class="form-control" value="{{ supplier.name }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="supplier_type" class="form-label">供应商类型 *</label>
                            <select id="supplier_type" name="supplier_type" class="form-select" required>
                                <option value="">请选择供应商类型</option>
                                {% for type in supplier_types %}
                                <option value="{{ type }}" {% if supplier.supplier_type == type %}selected{% endif %}>
                                    {% if type == 'visa' %}签证
                                    {% elif type == 'flight' %}机票
                                    {% elif type == 'hotel' %}酒店
                                    {% elif type == 'transport' %}用车
                                    {% elif type == 'local_operator' %}地接
                                    {% else %}其他
                                    {% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="contact_person" class="form-label">联系人</label>
                            <input type="text" id="contact_person" name="contact_person" class="form-control" value="{{ supplier.contact_person or '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phone" class="form-label">联系电话</label>
                            <input type="tel" id="phone" name="phone" class="form-control" value="{{ supplier.phone or '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email" class="form-label">电子邮箱</label>
                            <input type="email" id="email" name="email" class="form-control" value="{{ supplier.email or '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="status" class="form-label">状态</label>
                            <select id="status" name="status" class="form-select">
                                <option value="active" {% if supplier.status == 'active' %}selected{% endif %}>活跃</option>
                                <option value="inactive" {% if supplier.status == 'inactive' %}selected{% endif %}>非活跃</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="country" class="form-label">国家</label>
                            <input type="text" id="country" name="country" class="form-control" value="{{ supplier.country or '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="region" class="form-label">地区</label>
                            <input type="text" id="region" name="region" class="form-control" value="{{ supplier.region or '' }}">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-group">
                            <label for="address" class="form-label">地址</label>
                            <textarea id="address" name="address" class="form-control" rows="3">{{ supplier.address or '' }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="mt-4 text-center">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <a href="{{ url_for('supplier.suppliers') }}" class="btn btn-secondary ms-2">返回列表</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
