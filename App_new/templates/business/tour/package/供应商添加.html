<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加供应商</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="my-4 text-center">添加供应商</h1>
        <form action="{{ url_for('supplier.add_supplier') }}" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">供应商名称</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="contact_person" class="form-label">联系人</label>
                    <input type="text" id="contact_person" name="contact_person" class="form-control">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">电话</label>
                    <input type="text" id="phone" name="phone" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">邮箱</label>
                    <input type="email" id="email" name="email" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">地址</label>
                <textarea id="address" name="address" class="form-control" rows="2"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="country" class="form-label">国家</label>
                    <input type="text" id="country" name="country" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="city" class="form-label">城市</label>
                    <input type="text" id="city" name="city" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">状态</label>
                <select id="status" name="status" class="form-select">
                    <option value="active">启用</option>
                    <option value="inactive">禁用</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success px-4">提交</button>
            </div>
        </form>
    </div>
</body>
</html>
