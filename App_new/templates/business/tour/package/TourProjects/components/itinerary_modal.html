{% macro render_itinerary_modal(itinerary, loop_index) %}
<!-- 编辑行程模态框 -->
<div class="modal custom-modal" id="editItineraryModal-{{ itinerary.id }}" style="display: none;">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑行程 - 第{{ loop_index }}天</h5>
                <button type="button" class="btn-close" data-action="close-modal"></button>
            </div>
            <div class="modal-body">
                <form method="POST" 
                      action="{{ url_for('tour_projects.edit_itinerary', itinerary_id=itinerary.id) }}" 
                      class="itinerary-edit-form" 
                      id="itinerary-edit-{{ itinerary.id }}"
                      data-itinerary-id="{{ itinerary.id }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-row-3">
                        <div class="form-group mb-3">
                            <label class="form-label">日期标题</label>
                            <input type="text" name="day_title" value="{{ itinerary.day_title }}" required class="form-control">
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">日期</label>
                            <input type="date" name="date" value="{{ itinerary.date }}" required class="form-control">
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">行程内容</label>
                        <textarea name="content" rows="5" required class="form-control">{{ itinerary.content }}</textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-action="close-modal">取消</button>
                <button type="submit" form="itinerary-edit-{{ itinerary.id }}" class="btn btn-success">保存编辑</button>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
