{% extends "shared/staff_base.html" %}

{% block title %}添加旅游产品{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin: 40px auto;
    }
    .header-section {
        background: linear-gradient(135deg, #3498db, #2c3e50);
        color: white;
        padding: 40px 0;
        margin-bottom: 30px;
    }
    .form-label {
        font-weight: 500;
        color: #2c3e50;
    }
    .btn-submit {
        background-color: #3498db;
        border: none;
        padding: 10px 30px;
        border-radius: 30px;
        transition: all 0.3s ease;
    }
    .btn-submit:hover {
        background-color: #2980b9;
        transform: scale(1.05);
    }
    .btn-cancel {
        background-color: #95a5a6;
        border: none;
        padding: 10px 30px;
        border-radius: 30px;
        transition: all 0.3s ease;
    }
    .btn-cancel:hover {
        background-color: #7f8c8d;
        transform: scale(1.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="header-section">
    <div class="container">
        <h1 class="text-center">添加新旅游产品</h1>
    </div>
</div>

<div class="container">
        <div class="form-container">
            <form method="POST" action="{{ url_for('product_details.add_product') }}">
                <div class="mb-3">
                    <label for="title" class="form-label">产品标题</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>

                <div class="mb-3">
                    <label for="duration" class="form-label">行程时长</label>
                    <input type="text" class="form-control" id="duration" name="duration" placeholder="例如：3天2晚" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">价格</label>
                    <div class="input-group">
                        <span class="input-group-text">SGD</span>
                        <input type="number" class="form-control" id="price" name="price" step="0.01" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="itinerary" class="form-label">行程安排</label>
                    <textarea class="form-control" id="itinerary" name="itinerary" rows="5" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="included" class="form-label">费用包含</label>
                    <textarea class="form-control" id="included" name="included" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="not_included" class="form-label">费用不包含</label>
                    <textarea class="form-control" id="not_included" name="not_included" rows="3" required></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('product_details.tour_product_details') }}" class="btn btn-cancel text-white">取消</a>
                    <button type="submit" class="btn btn-submit text-white">添加产品</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
