{% extends "shared/staff_base.html" %}

{% block title %}添加旅游产品{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tour_common.css') }}">
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .form-container {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .form-input {
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }
    .form-input:focus {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .btn-submit {
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }
    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .btn-cancel {
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }
    .btn-cancel:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="bg-gray-50 min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto">
        <!-- 页面标题 -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">添加新旅游产品</h1>
                    <p class="text-gray-600 mt-2">创建精彩的旅游产品，为客户提供优质服务</p>
                </div>
                <a href="{{ url_for('product_details.tour_product_details') }}" 
                   class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>返回列表
                </a>
            </div>
        </div>

        <!-- 表单容器 -->
        <div class="form-container rounded-2xl shadow-md p-8">
            <form method="POST" action="{{ url_for('product_details.add_product') }}">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 产品标题 -->
                    <div class="md:col-span-2">
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-tag mr-2 text-blue-500"></i>产品标题
                        </label>
                        <input type="text" 
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400" 
                               id="title" name="title" required>
                    </div>

                    <!-- 行程时长 -->
                    <div>
                        <label for="duration" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-clock mr-2 text-green-500"></i>行程时长
                        </label>
                        <input type="text" 
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400" 
                               id="duration" name="duration" placeholder="例如：3天2晚" required>
                    </div>

                    <!-- 价格 -->
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-dollar-sign mr-2 text-yellow-500"></i>价格
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">SGD</span>
                            </div>
                            <input type="number" 
                                   class="form-input w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400" 
                                   id="price" name="price" step="0.01" required>
                        </div>
                    </div>

                    <!-- 行程安排 -->
                    <div class="md:col-span-2">
                        <label for="itinerary" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-route mr-2 text-purple-500"></i>行程安排
                        </label>
                        <textarea class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400" 
                                  id="itinerary" name="itinerary" rows="5" required></textarea>
                    </div>

                    <!-- 费用包含 -->
                    <div>
                        <label for="included" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-check-circle mr-2 text-green-500"></i>费用包含
                        </label>
                        <textarea class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400" 
                                  id="included" name="included" rows="3" required></textarea>
                    </div>

                    <!-- 费用不包含 -->
                    <div>
                        <label for="not_included" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-times-circle mr-2 text-red-500"></i>费用不包含
                        </label>
                        <textarea class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400" 
                                  id="not_included" name="not_included" rows="3" required></textarea>
                    </div>
                </div>

                <!-- 按钮区域 -->
                <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-gray-200">
                    <a href="{{ url_for('product_details.tour_product_details') }}" 
                       class="btn-cancel bg-gray-500 text-white px-6 py-3 rounded-lg font-medium">
                        <i class="fas fa-times mr-2"></i>取消
                    </a>
                    <button type="submit" 
                            class="btn-submit bg-blue-500 text-white px-6 py-3 rounded-lg font-medium">
                        <i class="fas fa-plus mr-2"></i>添加产品
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
