{% extends "shared/staff_base.html" %}

{% block title %}Confirm Create - MyTravelPanel{% endblock %}

{% block page_title %}Confirm Create{% endblock %}

{% block extra_css %}
<style>
    .confirm-container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: #FFFF99;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .header-row {
        display: grid;
        grid-template-columns: 120px 1fr;
        margin-bottom: 15px;
        align-items: center;
    }
    
    .header-label {
        font-weight: bold;
        color: #333;
    }
    
    .action-buttons {
        margin-top: 20px;
        text-align: center;
    }
    
    .action-button {
        margin: 0 10px;
        padding: 8px 20px;
        border: 1px solid #ddd;
        background-color: #f5f5f5;
        cursor: pointer;
        border-radius: 4px;
    }
    
    .action-button.primary {
        background-color: #007bff;
        color: white;
        border-color: #0056b3;
    }
    
    .action-button.secondary {
        background-color: #6c757d;
        color: white;
        border-color: #545b62;
    }
</style>
{% endblock %}

{% block content %}
<div class="confirm-container">
    <h2 class="text-center mb-4">确认创建新项目</h2>
    
    <div class="header-row">
        <span class="header-label">HID编号:</span>
        <input type="text" class="form-control" id="hid" readonly value="{{ generated_hid }}">
    </div>
    
    <div class="action-buttons">
        <button class="action-button primary" onclick="confirmCreate()">确认创建</button>
        <button class="action-button secondary" onclick="window.history.back()">返回</button>
    </div>
</div>

<script>
function confirmCreate() {
    const hid = document.getElementById('hid').value;
    const baseUrl = "{{ url_for('projects.create_project', hid='PLACEHOLDER') }}".replace('PLACEHOLDER', hid);
    window.location.href = baseUrl;
}
</script>
{% endblock %}
