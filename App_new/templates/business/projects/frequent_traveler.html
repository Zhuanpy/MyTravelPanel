{% extends "shared/staff_base.html" %}

{% block title %}常用旅客管理{% endblock %}

{% block content %}
<div class="container-fluid" style="padding: 20px;">
    <!-- 页面标题 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="fas fa-user-friends"></i> 常用旅客管理</h5>
        <div class="d-flex gap-2">
            <div class="btn-group btn-group-sm">
                <a href="/projects/frequent_traveler/api/template" class="btn btn-outline-secondary" title="下载空白模板">
                    <i class="fas fa-file-download"></i> 模板
                </a>
                <button class="btn btn-outline-success" onclick="importExcel()" title="从Excel导入旅客信息">
                    <i class="fas fa-file-import"></i> 导入
                </button>
                <a href="/projects/frequent_traveler/api/export" class="btn btn-outline-primary" title="导出全部旅客信息为Excel">
                    <i class="fas fa-file-export"></i> 导出
                </a>
            </div>
            <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display: none;" onchange="doImport(this)">
            <button class="btn btn-primary btn-sm" onclick="openTravelerModal()">
                <i class="fas fa-plus"></i> 添加常用旅客
            </button>
        </div>
    </div>

    <!-- 搜索栏 -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm" id="searchKeyword"
                           placeholder="搜索姓名/英文名/电话/护照号/邮箱..." onkeyup="if(event.key==='Enter') loadTravelers()">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" id="searchCompany">
                        <option value="">全部公司</option>
                        {% for c in companies %}
                        <option value="{{ c.id }}">{{ c.company_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-sm btn-outline-primary" onclick="loadTravelers()">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="resetSearch()">重置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 旅客列表 -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0" style="font-size: 0.85rem;">
                <thead class="table-light">
                    <tr>
                        <th style="width: 4%;">#</th>
                        <th style="width: 6%;">称谓</th>
                        <th style="width: 14%;">姓名</th>
                        <th style="width: 12%;">电话</th>
                        <th style="width: 14%;">护照号</th>
                        <th style="width: 10%;">护照有效期</th>
                        <th style="width: 12%;">公司</th>
                        <th style="width: 12%;">资料</th>
                        <th style="width: 16%;">操作</th>
                    </tr>
                </thead>
                <tbody id="travelersTbody">
                    <tr><td colspan="9" class="text-center text-muted py-4">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="card-footer d-flex justify-content-between align-items-center py-2">
            <small class="text-muted" id="travelerCount">共 0 条记录</small>
            <nav>
                <ul class="pagination pagination-sm mb-0" id="travelerPagination"></ul>
            </nav>
        </div>
    </div>
</div>

<!-- 常用旅客编辑模态框 -->
<style>
    #travelerModal .section-card {
        background: #f8f9fc;
        border: 1px solid #e9ecf1;
        border-radius: 8px;
        padding: 14px 16px 8px;
        margin-bottom: 12px;
    }
    #travelerModal .section-title {
        font-size: 0.82rem;
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    #travelerModal .section-title i {
        color: #667eea;
        font-size: 0.85rem;
    }
    #travelerModal .form-label {
        font-size: 0.78rem;
        color: #6b7280;
        margin-bottom: 3px;
        font-weight: 500;
    }
    #travelerModal .form-control-sm,
    #travelerModal .form-select-sm {
        font-size: 0.85rem;
        border-radius: 6px;
    }
    #travelerModal .modal-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border-radius: 8px 8px 0 0;
        padding: 14px 20px;
    }
    #travelerModal .modal-title { color: #fff; font-size: 1rem; }
    #travelerModal .modal-header .close { color: #fff; opacity: 0.85; }
    #travelerModal .modal-header .close:hover { opacity: 1; }
    #travelerModal .modal-footer {
        border-top: 1px solid #e9ecf1;
        padding: 10px 20px;
    }
    #travelerModal .membership-row {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 6px;
    }
    #travelerModal .upload-zone {
        background: #fff;
        border: 1px dashed #cbd5e0;
        border-radius: 8px;
        padding: 12px;
    }
</style>
<div id="travelerModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.45); z-index: 1050; overflow-y: auto;">
    <div class="modal-content" style="max-width: 720px; margin: 28px auto; border-radius: 8px; border: none; box-shadow: 0 8px 30px rgba(0,0,0,0.18);">
        <div class="modal-header">
            <h5 class="modal-title" id="travelerModalTitle"><i class="fas fa-user-plus me-2"></i>添加常用旅客</h5>
            <span class="close" onclick="closeTravelerModal()">&times;</span>
        </div>
        <div class="modal-body" style="max-height: 72vh; overflow-y: auto; padding: 16px 20px;">
            <form id="travelerForm">
                <input type="hidden" id="travelerId">

                <!-- 基本信息 -->
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-user"></i> 基本信息</div>
                    <div class="row g-2">
                        <div class="col-md-2">
                            <label class="form-label">称谓</label>
                            <select class="form-select form-select-sm" id="travelerTitle">
                                <option value="">-</option>
                                <option value="MR">MR</option>
                                <option value="MS">MS</option>
                                <option value="MISS">MISS</option>
                                <option value="MASTER">MASTER</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm" id="travelerName" placeholder="请输入姓名" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">性别</label>
                            <select class="form-select form-select-sm" id="travelerGender">
                                <option value="">-</option>
                                <option value="male">男</option>
                                <option value="female">女</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">国籍</label>
                            <input type="text" class="form-control form-control-sm" id="travelerNationality" placeholder="如 CHINA">
                        </div>
                    </div>
                    <div class="row g-2 mt-0">
                        <div class="col-md-4">
                            <label class="form-label">出生日期</label>
                            <input type="date" class="form-control form-control-sm" id="travelerDob">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">联系电话</label>
                            <input type="text" class="form-control form-control-sm" id="travelerPhone" placeholder="+65 ...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control form-control-sm" id="travelerEmail" placeholder="email@example.com">
                        </div>
                    </div>
                    <div class="row g-2 mt-0">
                        <div class="col-md-8">
                            <label class="form-label">关联公司</label>
                            <select class="form-select form-select-sm" id="travelerCompany">
                                <option value="">无</option>
                                {% for c in companies %}
                                <option value="{{ c.id }}">{{ c.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 证件信息 -->
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-id-card"></i> 证件信息</div>
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label">护照号码</label>
                            <input type="text" class="form-control form-control-sm" id="travelerPassport" placeholder="E12345678">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">签发国</label>
                            <input type="text" class="form-control form-control-sm" id="travelerPassportCountry" placeholder="如 CHINA">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">护照有效期</label>
                            <input type="date" class="form-control form-control-sm" id="travelerPassportExpiry">
                        </div>
                    </div>
                    <div class="row g-2 mt-0">
                        <div class="col-md-4">
                            <label class="form-label">身份证号码</label>
                            <input type="text" class="form-control form-control-sm" id="travelerIdCard">
                        </div>
                    </div>
                </div>

                <!-- 航空会员 -->
                <div class="section-card">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="section-title mb-0"><i class="fas fa-plane"></i> 航空会员</div>
                        <button type="button" class="btn btn-outline-primary btn-sm py-0 px-2" onclick="addMembershipRow()" style="font-size: 0.78rem;">
                            <i class="fas fa-plus"></i> 添加
                        </button>
                    </div>
                    <div id="airlineMemberships">
                        <!-- 动态添加的会员行 -->
                    </div>
                    <div id="membershipEmpty" class="text-center text-muted py-1" style="font-size: 0.8rem;">
                        <i class="fas fa-info-circle"></i> 点击"添加"录入航空会员信息
                    </div>
                </div>

                <!-- 备注 -->
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-comment-alt"></i> 备注</div>
                    <textarea class="form-control form-control-sm" id="travelerRemarks" rows="2" placeholder="其他需要记录的信息..."></textarea>
                </div>
            </form>

            <!-- 资料上传（仅编辑模式显示） -->
            <div id="travelerFilesSection" style="display: none;">
                <div class="section-card">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="section-title mb-0"><i class="fas fa-folder-open"></i> 上传资料</div>
                        <div>
                            <small class="text-muted me-2" id="filesCountLabel"></small>
                            <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" id="downloadAllBtn"
                                    style="font-size: 0.72rem; display: none;" onclick="downloadAllFiles()">
                                <i class="fas fa-file-archive"></i> 打包下载
                            </button>
                        </div>
                    </div>
                    <div class="upload-zone">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">分类</label>
                                <select class="form-select form-select-sm" id="uploadCategory">
                                    <option value="passport">护照</option>
                                    <option value="ic">IC/身份证</option>
                                    <option value="membership_card">会员卡</option>
                                    <option value="visa">签证页</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">说明</label>
                                <input type="text" class="form-control form-control-sm" id="uploadDescription" placeholder="如：护照首页">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">选择文件 <small class="text-muted">(可多选)</small></label>
                                <input type="file" class="form-control form-control-sm" id="uploadFileInput" multiple
                                       accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.pdf,.doc,.docx">
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-sm btn-success w-100" onclick="uploadTravelerFile()" id="uploadBtn">
                                    <i class="fas fa-upload"></i> 上传
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="travelerFilesList" class="mt-2"></div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" onclick="closeTravelerModal()">取消</button>
            <button type="button" class="btn btn-primary btn-sm" onclick="saveTraveler()"><i class="fas fa-save me-1"></i>保存</button>
        </div>
    </div>
</div>

<!-- 旅客详情模态框 -->
<div id="travelerDetailModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1050; overflow-y: auto;">
    <div class="modal-content" style="max-width: 650px; margin: 30px auto;">
        <div class="modal-header">
            <h5 class="modal-title">旅客详情</h5>
            <span class="close" onclick="document.getElementById('travelerDetailModal').style.display='none'">&times;</span>
        </div>
        <div class="modal-body" id="travelerDetailBody" style="max-height: 70vh; overflow-y: auto;">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('travelerDetailModal').style.display='none'">关闭</button>
        </div>
    </div>
</div>

<!-- 图片预览模态框 -->
<div id="imagePreviewModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1060; overflow-y: auto;">
    <div style="max-width: 900px; margin: 30px auto; text-align: center;">
        <div class="d-flex justify-content-between align-items-center mb-2 px-2">
            <span id="previewTitle" style="color: #fff; font-size: 0.9rem;"></span>
            <span class="close" style="color: #fff; font-size: 28px; cursor: pointer;" onclick="document.getElementById('imagePreviewModal').style.display='none'">&times;</span>
        </div>
        <img id="previewImg" src="" style="max-width: 100%; max-height: 80vh; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
    </div>
</div>

<script>
let currentPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadTravelers();
});

// ---- Excel 导入导出 ----
function importExcel() {
    document.getElementById('importFileInput').click();
}

function doImport(input) {
    if (!input.files.length) return;
    const file = input.files[0];
    if (!confirm(`确定要从 "${file.name}" 导入旅客信息吗？\n\n- 有ID的行 → 更新已有记录\n- 无ID的行 → 新增记录`)) {
        input.value = '';
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    // 显示加载状态
    const btn = document.querySelector('[onclick="importExcel()"]');
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 导入中...';

    fetch('/projects/frequent_traveler/api/import', {
        method: 'POST',
        body: formData,
    })
    .then(r => r.json())
    .then(result => {
        btn.disabled = false;
        btn.innerHTML = origHtml;
        input.value = '';
        if (result.success) {
            let msg = result.message;
            if (result.errors && result.errors.length) {
                msg += '\n\n错误详情:\n' + result.errors.join('\n');
            }
            alert(msg);
            loadTravelers(1);
        } else {
            alert('导入失败: ' + result.message);
        }
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerHTML = origHtml;
        input.value = '';
        alert('导入失败');
    });
}

function loadTravelers(page) {
    currentPage = page || 1;
    const keyword = document.getElementById('searchKeyword').value.trim();
    const companyId = document.getElementById('searchCompany').value;
    const params = new URLSearchParams({page: currentPage, per_page: 20});
    if (keyword) params.set('keyword', keyword);
    if (companyId) params.set('company_id', companyId);

    fetch(`/projects/frequent_traveler/api/list?${params}`)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                renderTravelers(data.data, data.total, data.page, data.pages);
            }
        })
        .catch(err => console.error('加载失败:', err));
}

function renderTravelers(travelers, total, page, pages) {
    const tbody = document.getElementById('travelersTbody');
    document.getElementById('travelerCount').textContent = `共 ${total} 条记录`;

    if (!travelers.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">暂无常用旅客</td></tr>';
        document.getElementById('travelerPagination').innerHTML = '';
        return;
    }

    tbody.innerHTML = travelers.map((t, idx) => {
        const expiryClass = t.passport_expiry_date && new Date(t.passport_expiry_date) < new Date() ? 'text-danger' : '';
        const fc = t.file_count || 0;
        return `
        <tr style="cursor: pointer;" onclick="viewTraveler(${t.id})">
            <td>${(page - 1) * 20 + idx + 1}</td>
            <td>${t.title || ''}</td>
            <td><strong>${t.name}</strong></td>
            <td>${t.phone || ''}</td>
            <td>${t.passport_number || ''}</td>
            <td class="${expiryClass}">${t.passport_expiry_date || ''}</td>
            <td><small>${t.company_name || ''}</small></td>
            <td style="white-space: nowrap;">
                <button class="btn btn-sm btn-outline-success py-0 px-1" onclick="event.stopPropagation(); quickUpload(${t.id})" title="上传资料" style="font-size: 0.75rem;">
                    <i class="fas fa-upload"></i>
                </button>
                ${fc > 0 ? `<a href="/projects/frequent_traveler/api/${t.id}/files/download_all" class="btn btn-sm btn-outline-info py-0 px-1" onclick="event.stopPropagation();" title="打包下载全部资料" style="font-size: 0.75rem;">
                    <i class="fas fa-download"></i>
                </a>
                <span class="badge bg-info" style="font-size: 0.65rem;">${fc}</span>` : '<small class="text-muted">0</small>'}
            </td>
            <td style="white-space: nowrap;">
                <button class="btn btn-sm btn-outline-primary py-0 px-1" onclick="event.stopPropagation(); editTraveler(${t.id})" title="编辑" style="font-size: 0.75rem;">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="event.stopPropagation(); deleteTraveler(${t.id}, '${t.name}')" title="删除" style="font-size: 0.75rem;">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>`;
    }).join('');

    // 分页
    let phtml = '';
    if (pages > 1) {
        phtml += `<li class="page-item ${page <= 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); loadTravelers(${page - 1})">&laquo;</a></li>`;
        for (let i = 1; i <= pages; i++) {
            if (i === 1 || i === pages || (i >= page - 2 && i <= page + 2)) {
                phtml += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); loadTravelers(${i})">${i}</a></li>`;
            } else if (i === page - 3 || i === page + 3) {
                phtml += '<li class="page-item disabled"><span class="page-link">...</span></li>';
            }
        }
        phtml += `<li class="page-item ${page >= pages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); loadTravelers(${page + 1})">&raquo;</a></li>`;
    }
    document.getElementById('travelerPagination').innerHTML = phtml;
}

function resetSearch() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('searchCompany').value = '';
    loadTravelers(1);
}

// ---- 模态框操作 ----
function openTravelerModal(traveler) {
    const modal = document.getElementById('travelerModal');
    const title = document.getElementById('travelerModalTitle');
    document.getElementById('travelerForm').reset();
    document.getElementById('travelerId').value = '';
    document.getElementById('airlineMemberships').innerHTML = '';
    document.getElementById('membershipEmpty').style.display = '';

    const filesSection = document.getElementById('travelerFilesSection');

    if (traveler) {
        title.textContent = '编辑常用旅客';
        document.getElementById('travelerId').value = traveler.id;
        document.getElementById('travelerTitle').value = traveler.title || '';
        document.getElementById('travelerName').value = traveler.name || '';
        // name_en 字段已移除，不再需要
        document.getElementById('travelerGender').value = traveler.gender || '';
        document.getElementById('travelerDob').value = traveler.date_of_birth || '';
        document.getElementById('travelerNationality').value = traveler.nationality || '';
        document.getElementById('travelerPhone').value = traveler.phone || '';
        document.getElementById('travelerEmail').value = traveler.email || '';
        document.getElementById('travelerPassport').value = traveler.passport_number || '';
        document.getElementById('travelerPassportCountry').value = traveler.passport_issuing_country || '';
        document.getElementById('travelerPassportExpiry').value = traveler.passport_expiry_date || '';
        document.getElementById('travelerIdCard').value = traveler.id_card_number || '';
        document.getElementById('travelerCompany').value = traveler.company_id || '';
        document.getElementById('travelerRemarks').value = traveler.remarks || '';

        // 航空会员
        if (traveler.airline_memberships && traveler.airline_memberships.length) {
            traveler.airline_memberships.forEach(m => addMembershipRow(m));
        }

        // 显示文件上传区并加载文件列表
        filesSection.style.display = '';
        loadTravelerFiles(traveler.id);
    } else {
        title.textContent = '添加常用旅客';
        filesSection.style.display = 'none';
        document.getElementById('travelerFilesList').innerHTML = '';
    }
    modal.style.display = 'block';
}

function closeTravelerModal() {
    document.getElementById('travelerModal').style.display = 'none';
}

function addMembershipRow(data) {
    const container = document.getElementById('airlineMemberships');
    document.getElementById('membershipEmpty').style.display = 'none';
    const row = document.createElement('div');
    row.className = 'd-flex gap-2 align-items-center membership-row';
    row.innerHTML = `
        <input type="text" class="form-control form-control-sm membership-airline" placeholder="航空公司" value="${data ? (data.airline || '') : ''}" style="flex:2;">
        <input type="text" class="form-control form-control-sm membership-number" placeholder="会员号码" value="${data ? (data.number || '') : ''}" style="flex:3;">
        <button type="button" class="btn btn-outline-danger btn-sm py-0 px-1" onclick="this.closest('.membership-row').remove(); updateMembershipEmpty()" style="font-size:0.78rem;">
            <i class="fas fa-times"></i>
        </button>`;
    container.appendChild(row);
}

function updateMembershipEmpty() {
    const rows = document.querySelectorAll('.membership-row');
    document.getElementById('membershipEmpty').style.display = rows.length ? 'none' : '';
}

function collectMemberships() {
    const rows = document.querySelectorAll('.membership-row');
    const result = [];
    rows.forEach(row => {
        const airline = row.querySelector('.membership-airline').value.trim();
        const number = row.querySelector('.membership-number').value.trim();
        if (airline || number) {
            result.push({airline, number});
        }
    });
    return result;
}

function saveTraveler() {
    const name = document.getElementById('travelerName').value.trim();
    if (!name) {
        alert('请输入姓名');
        return;
    }

    const id = document.getElementById('travelerId').value;
    const data = {
        title: document.getElementById('travelerTitle').value,
        name: name,
        gender: document.getElementById('travelerGender').value,
        date_of_birth: document.getElementById('travelerDob').value || null,
        nationality: document.getElementById('travelerNationality').value.trim(),
        phone: document.getElementById('travelerPhone').value.trim(),
        email: document.getElementById('travelerEmail').value.trim(),
        passport_number: document.getElementById('travelerPassport').value.trim(),
        passport_issuing_country: document.getElementById('travelerPassportCountry').value.trim(),
        passport_expiry_date: document.getElementById('travelerPassportExpiry').value || null,
        id_card_number: document.getElementById('travelerIdCard').value.trim(),
        airline_memberships: collectMemberships(),
        company_id: document.getElementById('travelerCompany').value || null,
        remarks: document.getElementById('travelerRemarks').value.trim(),
    };

    const url = id ? `/projects/frequent_traveler/api/${id}` : '/projects/frequent_traveler/api/create';
    const method = id ? 'PUT' : 'POST';
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';

    fetch(url, {
        method,
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            closeTravelerModal();
            loadTravelers(currentPage);
        } else {
            alert('保存失败: ' + result.message);
        }
    })
    .catch(err => {
        console.error('保存失败:', err);
        alert('保存失败');
    });
}

function editTraveler(id) {
    fetch(`/projects/frequent_traveler/api/${id}`)
        .then(r => r.json())
        .then(data => {
            if (data.success) openTravelerModal(data.data);
        });
}

function viewTraveler(id) {
    fetch(`/projects/frequent_traveler/api/${id}`)
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const t = data.data;
            let membershipsHtml = '';
            if (t.airline_memberships && t.airline_memberships.length) {
                membershipsHtml = t.airline_memberships.map(m =>
                    `<tr><td>${m.airline || ''}</td><td>${m.number || ''}</td></tr>`
                ).join('');
                membershipsHtml = `<h6 class="mt-3"><i class="fas fa-plane"></i> 航空会员</h6>
                    <table class="table table-sm table-bordered" style="font-size:0.85rem;">
                    <thead><tr><th>航空公司</th><th>会员号</th></tr></thead>
                    <tbody>${membershipsHtml}</tbody></table>`;
            }
            const expiryWarning = t.passport_expiry_date && new Date(t.passport_expiry_date) < new Date()
                ? ' <span class="badge bg-danger">已过期</span>' : '';

            document.getElementById('travelerDetailBody').innerHTML = `
                <div class="row">
                    <div class="col-6"><strong>称谓:</strong> ${t.title || '-'}</div>
                    <div class="col-6"><strong>性别:</strong> ${t.gender === 'male' ? '男' : t.gender === 'female' ? '女' : '-'}</div>
                </div>
                <div class="row mt-1">
                    <div class="col-12"><strong>姓名:</strong> ${t.name}</div>
                </div>
                <div class="row mt-1">
                    <div class="col-6"><strong>出生日期:</strong> ${t.date_of_birth || '-'}</div>
                    <div class="col-6"><strong>国籍:</strong> ${t.nationality || '-'}</div>
                </div>
                <hr class="my-2">
                <div class="row">
                    <div class="col-6"><strong>电话:</strong> ${t.phone || '-'}</div>
                    <div class="col-6"><strong>邮箱:</strong> ${t.email || '-'}</div>
                </div>
                <hr class="my-2">
                <div class="row">
                    <div class="col-6"><strong>护照号:</strong> ${t.passport_number || '-'}</div>
                    <div class="col-6"><strong>签发国:</strong> ${t.passport_issuing_country || '-'}</div>
                </div>
                <div class="row mt-1">
                    <div class="col-6"><strong>护照有效期:</strong> ${t.passport_expiry_date || '-'}${expiryWarning}</div>
                    <div class="col-6"><strong>身份证:</strong> ${t.id_card_number || '-'}</div>
                </div>
                ${membershipsHtml}
                <div class="row mt-2">
                    <div class="col-12"><strong>关联公司:</strong> ${t.company_name || '-'}</div>
                </div>
                ${t.remarks ? `<div class="row mt-1"><div class="col-12"><strong>备注:</strong> ${t.remarks}</div></div>` : ''}
                <div id="detailFilesArea" class="mt-3"></div>
            `;
            document.getElementById('travelerDetailModal').style.display = 'block';
            // 加载文件列表到详情弹窗
            loadDetailFiles(id);
        });
}

function deleteTraveler(id, name) {
    if (!confirm(`确定要删除常用旅客 "${name}" 吗？`)) return;
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
    fetch(`/projects/frequent_traveler/api/${id}`, {
        method: 'DELETE',
        headers: {'X-CSRFToken': csrfToken}
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) loadTravelers(currentPage);
        else alert('删除失败: ' + result.message);
    });
}

// ---- 详情弹窗文件展示 ----
function loadDetailFiles(travelerId) {
    const area = document.getElementById('detailFilesArea');
    fetch(`/projects/frequent_traveler/api/${travelerId}/files`)
        .then(r => r.json())
        .then(data => {
            if (!data.success || !data.data.length) {
                area.innerHTML = '';
                return;
            }
            const images = data.data.filter(f => f.is_image);
            const docs = data.data.filter(f => !f.is_image);
            let html = `<div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="fas fa-folder-open"></i> 上传资料 <small class="text-muted">(${data.data.length})</small></h6>
                <a href="/projects/frequent_traveler/api/${travelerId}/files/download_all" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size:0.75rem;">
                    <i class="fas fa-file-archive"></i> 打包下载
                </a>
            </div><div class="mt-2"></div>`;
            if (images.length) {
                html += '<div class="d-flex flex-wrap gap-2 mb-2">';
                images.forEach(f => {
                    html += `
                        <div style="text-align:center; width: 100px;">
                            <img src="/projects/frequent_traveler/api/files/${f.id}/download"
                                 style="width:100px; height:75px; object-fit:cover; border-radius:4px; cursor:pointer; border:1px solid #dee2e6;"
                                 onclick="previewImage('/projects/frequent_traveler/api/files/${f.id}/download', '${f.filename.replace(/'/g, "\\'")}')"
                                 title="${f.filename}">
                            <div style="font-size:0.7rem;" class="text-muted text-truncate" title="${f.description || f.filename}">
                                <span class="badge bg-secondary" style="font-size:0.6rem;">${f.category_display}</span>
                                ${f.description || ''}
                            </div>
                        </div>`;
                });
                html += '</div>';
            }
            if (docs.length) {
                docs.forEach(f => {
                    html += `<div style="font-size:0.85rem;" class="mb-1">
                        <i class="fas fa-file text-muted me-1"></i>
                        <span class="badge bg-secondary" style="font-size:0.65rem;">${f.category_display}</span>
                        <a href="/projects/frequent_traveler/api/files/${f.id}/download" target="_blank">${f.description || f.filename}</a>
                        <small class="text-muted">(${f.file_size_display})</small>
                    </div>`;
                });
            }
            area.innerHTML = html;
        });
}

// ---- 文件上传管理 ----
function loadTravelerFiles(travelerId) {
    const container = document.getElementById('travelerFilesList');
    const countLabel = document.getElementById('filesCountLabel');
    const dlAllBtn = document.getElementById('downloadAllBtn');
    fetch(`/projects/frequent_traveler/api/${travelerId}/files`)
        .then(r => r.json())
        .then(data => {
            if (!data.success || !data.data.length) {
                container.innerHTML = '<div class="text-muted text-center py-2" style="font-size:0.8rem;">暂无上传资料</div>';
                countLabel.textContent = '';
                dlAllBtn.style.display = 'none';
                return;
            }
            countLabel.textContent = `共 ${data.data.length} 个文件`;
            dlAllBtn.style.display = '';
            container.innerHTML = `
                <div class="list-group list-group-flush" style="font-size: 0.82rem;">
                    ${data.data.map(f => `
                        <div class="list-group-item d-flex align-items-center px-2 py-1">
                            ${f.is_image
                                ? `<img src="/projects/frequent_traveler/api/files/${f.id}/download"
                                        style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; margin-right: 8px;"
                                        onclick="event.stopPropagation(); previewImage('/projects/frequent_traveler/api/files/${f.id}/download', '${f.filename.replace(/'/g, "\\'")}')">`
                                : `<i class="fas fa-file-pdf text-danger me-2" style="font-size: 1.2rem;"></i>`
                            }
                            <div class="flex-grow-1" style="min-width: 0;">
                                <div class="text-truncate" title="${f.filename}">
                                    <span class="badge bg-secondary" style="font-size: 0.65rem;">${f.category_display}</span>
                                    ${f.description || f.filename}
                                </div>
                                <small class="text-muted">${f.file_size_display}</small>
                            </div>
                            <div class="ms-2 text-nowrap">
                                <a href="/projects/frequent_traveler/api/files/${f.id}/download" target="_blank"
                                   class="btn btn-sm btn-outline-primary py-0 px-1" title="查看" style="font-size: 0.7rem;">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <button class="btn btn-sm btn-outline-danger py-0 px-1" title="删除" style="font-size: 0.7rem;"
                                        onclick="deleteTravelerFile(${f.id}, ${travelerId})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        })
        .catch(err => {
            container.innerHTML = '<div class="text-danger text-center py-2" style="font-size:0.8rem;">加载文件失败</div>';
        });
}

function uploadTravelerFile() {
    const travelerId = document.getElementById('travelerId').value;
    if (!travelerId) {
        alert('请先保存旅客信息后再上传文件');
        return;
    }
    const fileInput = document.getElementById('uploadFileInput');
    if (!fileInput.files.length) {
        alert('请选择文件');
        return;
    }

    const formData = new FormData();
    // 批量添加所有选中的文件
    for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('file', fileInput.files[i]);
    }
    formData.append('file_category', document.getElementById('uploadCategory').value);
    formData.append('description', document.getElementById('uploadDescription').value.trim());

    const btn = document.getElementById('uploadBtn');
    const count = fileInput.files.length;
    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 上传中(${count})...`;

    fetch(`/projects/frequent_traveler/api/${travelerId}/files/upload`, {
        method: 'POST',
        body: formData,
    })
    .then(r => r.json())
    .then(result => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> 上传';
        if (result.success) {
            fileInput.value = '';
            document.getElementById('uploadDescription').value = '';
            loadTravelerFiles(travelerId);
        } else {
            alert('上传失败: ' + result.message);
        }
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> 上传';
        alert('上传失败');
    });
}

// ---- 列表页快速上传 ----
function quickUpload(travelerId) {
    // 创建一个临时的隐藏文件选择器
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.jpg,.jpeg,.png,.gif,.webp,.bmp,.pdf,.doc,.docx';
    input.onchange = function() {
        if (!input.files.length) return;

        // 弹出分类选择
        const categories = {'passport': '护照', 'ic': 'IC/身份证', 'membership_card': '会员卡', 'visa': '签证页', 'other': '其他'};
        const catKeys = Object.keys(categories);
        const catLabels = catKeys.map((k, i) => `${i + 1}. ${categories[k]}`).join('\n');
        const choice = prompt(`已选择 ${input.files.length} 个文件\n请选择分类（输入数字）:\n${catLabels}`, '1');
        if (choice === null) return;
        const catIdx = parseInt(choice) - 1;
        const category = catKeys[catIdx] || 'other';

        const formData = new FormData();
        for (let i = 0; i < input.files.length; i++) {
            formData.append('file', input.files[i]);
        }
        formData.append('file_category', category);

        // 显示上传中提示
        const row = document.querySelector(`tr[onclick*="viewTraveler(${travelerId})"]`);
        const uploadCell = row?.querySelectorAll('td')[7];
        const originalHtml = uploadCell?.innerHTML;
        if (uploadCell) uploadCell.innerHTML = '<i class="fas fa-spinner fa-spin text-success"></i> 上传中...';

        fetch(`/projects/frequent_traveler/api/${travelerId}/files/upload`, {
            method: 'POST',
            body: formData,
        })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                loadTravelers(currentPage);  // 刷新列表以更新文件计数
            } else {
                if (uploadCell) uploadCell.innerHTML = originalHtml;
                alert('上传失败: ' + result.message);
            }
        })
        .catch(err => {
            if (uploadCell) uploadCell.innerHTML = originalHtml;
            alert('上传失败');
        });
    };
    input.click();
}

function downloadAllFiles() {
    const travelerId = document.getElementById('travelerId').value;
    if (!travelerId) return;
    window.open(`/projects/frequent_traveler/api/${travelerId}/files/download_all`, '_blank');
}

function deleteTravelerFile(fileId, travelerId) {
    if (!confirm('确定要删除此文件吗？')) return;
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
    fetch(`/projects/frequent_traveler/api/files/${fileId}/delete`, {
        method: 'DELETE',
        headers: {'X-CSRFToken': csrfToken}
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) loadTravelerFiles(travelerId);
        else alert('删除失败: ' + result.message);
    });
}

function previewImage(url, filename) {
    document.getElementById('previewImg').src = url;
    document.getElementById('previewTitle').textContent = filename;
    document.getElementById('imagePreviewModal').style.display = 'block';
}

// 点击模态框外部关闭
document.getElementById('travelerModal')?.addEventListener('click', function(e) {
    if (e.target === this) closeTravelerModal();
});
document.getElementById('travelerDetailModal')?.addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
});
document.getElementById('imagePreviewModal')?.addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
});
</script>
