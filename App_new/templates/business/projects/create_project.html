{% extends "shared/staff_base.html" %}

{% block title %}Create Project - MyTravelPanel{% endblock %}

{% block page_title %}Create Project{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/project_detail.css') }}">
<style>
    .tour-create-project-page {
        background-color: #f0f2f5;
        padding: 20px;
        min-height: 100vh;
    }

    .tour-create-project-page .container-fluid {
        max-width: 1400px;
        margin: 20px auto;
        padding: 30px;
        background: white;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        border-radius: 12px;
    }

    .header-section {
        background-color: #FFFF99;
        padding: 20px;
        margin-bottom: 25px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }
    
    .form-row-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        align-items: end;
    }
    
    .form-group {
        margin-bottom: 0;
    }
    
    .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 5px;
        color: #333;
    }
    
    .form-group input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    
    .form-group input[readonly] {
        background-color: #f5f5f5;
    }

    .action-buttons {
        text-align: center;
    }
    
    .action-button {
        padding: 10px 30px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }
    
    .action-button:hover {
        background-color: #218838;
    }
    
    @media (max-width: 992px) {
        .form-row-4 {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    
    @media (max-width: 576px) {
        .form-row-4 {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="tour-create-project-page">
    <div class="container-fluid">
        <div class="header-section">
            <div class="form-row-4">
                <div class="form-group">
                    <label>HID编号</label>
                    <input type="text" class="form-control" name="hid" readonly value="{{ generated_hid }}">
                </div>
                <div class="form-group">
                    <label>项目名称</label>
                    <input type="text" class="form-control" name="project_name" required placeholder="请输入项目名称">
                </div>
                <div class="form-group">
                    <label>客户名称</label>
                    <input type="text" class="form-control" name="client_name" required placeholder="请输入客户名称">
                </div>
                <div class="form-group">
                    <label>开始日期</label>
                    <input type="date" class="form-control" name="start_date" value="{{ now.strftime('%Y-%m-%d') }}" required>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-button" onclick="saveProject()">创建项目</button>
        </div>
    </div>
</div>

<script>
function saveProject() {
    const formData = new FormData();
    
    // 添加CSRF令牌
    formData.append('csrf_token', '{{ csrf_token() }}');
    
    // 基本信息
    const hid = document.querySelector('[name="hid"]').value;
    const projectName = document.querySelector('[name="project_name"]').value;
    const clientName = document.querySelector('[name="client_name"]').value;
    const startDate = document.querySelector('[name="start_date"]').value;
    
    // 验证必填字段
    if (!projectName) {
        alert('请输入项目名称');
        return;
    }
    if (!clientName) {
        alert('请输入客户名称');
        return;
    }
    
    formData.append('project_name', projectName);
    formData.append('client_name', clientName);
    formData.append('start_date', startDate);
    formData.append('end_date', startDate);
    
    // Submit form
    fetch(`/projects/create/${hid}`, {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token() }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = `/projects/${data.project_id}`;
        } else {
            alert('保存失败: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败，请检查网络连接');
    });
}
</script>
{% endblock %}
