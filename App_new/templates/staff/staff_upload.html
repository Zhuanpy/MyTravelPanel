{% extends "shared/staff_base.html" %}

{% block title %}文件上传 - 员工系统{% endblock %}
{% block page_title %}文件上传{% endblock %}
{% block page_actions %}
<a href="{{ url_for('staff.files') }}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-left me-1"></i> 返回文件列表
</a>
{% endblock %}

{% block content %}
<div style="max-width: 720px; margin: 0 auto;">
    <div class="card">
        <div class="card-body py-3">
            <form method="POST" enctype="multipart/form-data" id="uploadForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <!-- 选择文件 -->
                <div class="mb-2">
                    <label for="file" class="form-label mb-1" style="font-size:0.85rem;">选择文件 <span class="text-danger">*</span></label>
                    <input type="file" class="form-control form-control-sm" id="file" name="file" required
                           accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.gif">
                    <small class="text-muted">PDF / Word / Excel / 图片，最大 16MB</small>
                </div>

                <!-- 文件名 + 分类 -->
                <div class="row g-2 mb-2">
                    <div class="col-7">
                        <label for="filename" class="form-label mb-1" style="font-size:0.85rem;">文件名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-sm" id="filename" name="filename" required placeholder="选择文件后自动填充">
                    </div>
                    <div class="col-5">
                        <label for="category" class="form-label mb-1" style="font-size:0.85rem;">分类 <span class="text-danger">*</span></label>
                        <select class="form-select form-select-sm" id="category" name="category" required>
                            <option value="">请选择</option>
                            <option value="visa">签证材料</option>
                            <option value="tour">旅游资料</option>
                            <option value="flight">机票资料</option>
                            <option value="hotel">酒店资料</option>
                            <option value="document">文档资料</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>

                <!-- 标签 + 权限 -->
                <div class="row g-2 mb-2">
                    <div class="col-7">
                        <label for="tags" class="form-label mb-1" style="font-size:0.85rem;">标签</label>
                        <input type="text" class="form-control form-control-sm" id="tags" name="tags" placeholder="用逗号分隔，如：重要,客户资料">
                    </div>
                    <div class="col-5">
                        <label for="permission" class="form-label mb-1" style="font-size:0.85rem;">访问权限</label>
                        <select class="form-select form-select-sm" id="permission" name="permission">
                            <option value="public">公开</option>
                            <option value="staff">仅员工</option>
                            <option value="admin">仅管理员</option>
                            <option value="private">私有</option>
                        </select>
                    </div>
                </div>

                <!-- 描述 -->
                <div class="mb-2">
                    <label for="description" class="form-label mb-1" style="font-size:0.85rem;">描述</label>
                    <textarea class="form-control form-control-sm" id="description" name="description" rows="2" placeholder="文件描述（可选）"></textarea>
                </div>

                <!-- 文件预览 -->
                <div class="mb-2" id="filePreview" style="display: none;">
                    <div class="border rounded p-2 bg-light" id="previewContent" style="font-size:0.85rem;"></div>
                </div>

                <!-- 上传进度 -->
                <div class="mb-2" id="uploadProgress" style="display: none;">
                    <div class="progress" style="height: 20px;">
                        <div class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                    </div>
                </div>

                <!-- 按钮 -->
                <div class="d-flex justify-content-end gap-2 pt-1">
                    <button type="reset" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-undo"></i> 重置
                    </button>
                    <button type="submit" class="btn btn-sm btn-primary" id="submitBtn">
                        <i class="fas fa-upload"></i> 上传文件
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.getElementById('file');
    const filenameInput = document.getElementById('filename');
    const filePreview = document.getElementById('filePreview');
    const previewContent = document.getElementById('previewContent');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');

    // 文件选择时自动填充文件名
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            const file = this.files[0];
            filenameInput.value = file.name;
            showFilePreview(file);
        }
    });

    function showFilePreview(file) {
        filePreview.style.display = 'block';
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewContent.innerHTML = `
                    <img src="${e.target.result}" style="max-height:120px;" class="img-fluid" alt="预览">
                    <div class="mt-1"><strong>${file.name}</strong> (${formatFileSize(file.size)})</div>`;
            };
            reader.readAsDataURL(file);
        } else {
            previewContent.innerHTML = `<i class="fas fa-file me-2"></i><strong>${file.name}</strong> (${formatFileSize(file.size)})`;
        }
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    uploadForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const progressBar = document.querySelector('.progress-bar');
        document.getElementById('uploadProgress').style.display = 'block';
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 30;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                setTimeout(() => { uploadForm.submit(); }, 500);
            }
            progressBar.style.width = progress + '%';
            progressBar.textContent = Math.round(progress) + '%';
        }, 200);
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';
    });

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file && file.size > 16 * 1024 * 1024) {
            alert('文件大小不能超过16MB');
            this.value = '';
            filenameInput.value = '';
            filePreview.style.display = 'none';
        }
    });
});
</script>
{% endblock %}
