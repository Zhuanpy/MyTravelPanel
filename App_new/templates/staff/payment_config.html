{% extends "shared/staff_base.html" %}

{% block title %}付款配置 - MyTravelPanel{% endblock %}
{% block page_title %}付款配置{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/staff_common.css') }}">
<style>
    .config-wrap { max-width: 600px; }
    .config-section {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        padding: 1.25rem 1.5rem;
        margin-bottom: 1.25rem;
    }
    .config-section h5 {
        font-size: 0.85rem;
        font-weight: 700;
        color: #374151;
        margin: 0 0 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #f3f4f6;
    }
    .qr-preview {
        max-width: 160px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
    }
</style>
{% endblock %}

{% block content %}
<div class="config-wrap">
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="config-section">
            <h5><i class="fas fa-university me-1"></i> 银行账户信息</h5>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label small fw-semibold">银行名称</label>
                    <input type="text" class="form-control" name="payment_bank_name"
                           value="{{ config.payment_bank_name }}" placeholder="如：OCBC Bank">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">账户名</label>
                    <input type="text" class="form-control" name="payment_account_name"
                           value="{{ config.payment_account_name }}" placeholder="收款人姓名">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">账号</label>
                    <input type="text" class="form-control" name="payment_account_number"
                           value="{{ config.payment_account_number }}" placeholder="银行账号">
                </div>
            </div>
        </div>

        <div class="config-section">
            <h5><i class="fas fa-qrcode me-1"></i> 付款二维码</h5>
            {% if config.payment_qr_image %}
            <div class="mb-3">
                <img src="{{ url_for('static', filename=config.payment_qr_image) }}" alt="当前二维码" class="qr-preview">
                <div class="small text-muted mt-1">当前二维码</div>
            </div>
            {% endif %}
            <input type="file" class="form-control" name="payment_qr_image" accept="image/*">
            <div class="form-text">上传新图片将替换当前二维码，支持 JPG/PNG</div>
        </div>

        <div class="config-section">
            <h5><i class="fas fa-sticky-note me-1"></i> 备注说明</h5>
            <textarea class="form-control" name="payment_note" rows="3"
                      placeholder="付款备注，如：请在转账备注中填写订单号">{{ config.payment_note }}</textarea>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>保存配置
            </button>
        </div>
    </form>
</div>
{% endblock %}
