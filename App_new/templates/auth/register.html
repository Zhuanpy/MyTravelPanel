{% extends "auth/base.html" %}

{% block title %}用户注册 - MyTravelPanel{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="auth-card">
            <div class="card-header">
                <h3 class="text-center mb-0">
                    <i class="fas fa-user-plus me-2"></i>会员注册
                </h3>
                <p class="text-center text-muted mt-2 mb-0">
                    注册成为我们的会员，享受专业的旅游服务
                </p>
            </div>
            
            <div class="auth-body-content">
                <form method="POST" class="auth-form" id="registerForm">
                    <!-- CSRF令牌 -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="first_name" class="form-label">姓名 *</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" 
                                       placeholder="请输入姓名" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="last_name" class="form-label">姓氏</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" 
                                       placeholder="请输入姓氏">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">邮箱地址 *</label>
                        <div class="input-group">
                            <input type="email" class="form-control" id="email" name="email" 
                                   placeholder="请输入邮箱地址" required>
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>
                        </div>
                        <div id="emailFeedback"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone" class="form-label">电话号码</label>
                        <div class="input-group">
                            <input type="tel" class="form-control" id="phone" name="phone" 
                                   placeholder="请输入电话号码">
                            <span class="input-group-text">
                                <i class="fas fa-phone"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">密码 *</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="请输入密码" required>
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="password-strength-bar">
                                <div class="password-strength-fill"></div>
                            </div>
                            <div class="password-strength-text"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm_password" class="form-label">确认密码 *</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                   placeholder="请再次输入密码" required>
                            <span class="input-group-text">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                        <label class="form-check-label" for="agree">
                            我同意 <a href="#" onclick="alert('服务条款即将上线')">服务条款</a> 和 <a href="#" onclick="alert('隐私政策即将上线')">隐私政策</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="auth-btn auth-btn-primary" id="registerBtn">
                        <i class="fas fa-user-plus me-2"></i>注册账户
                    </button>
                    
                    <div class="auth-loading" id="registerLoading">
                        <div class="spinner"></div>
                        正在注册...
                    </div>
                </form>
                
                <div class="auth-links">
                    <p class="mb-0">
                        已有账户？ <a href="{{ url_for('auth_profile.member_login') }}">立即登录</a>
                    </p>
                </div>
                
                <!-- 社交注册 -->
                <div class="social-login">
                    <p class="text-center text-muted mb-3">或使用以下方式注册</p>
                    <button type="button" class="social-btn" onclick="alert('Google注册功能即将上线')">
                        <i class="fab fa-google text-danger"></i>
                        使用 Google 注册
                    </button>
                    <button type="button" class="social-btn" onclick="alert('微信注册功能即将上线')">
                        <i class="fab fa-weixin text-success"></i>
                        使用 微信 注册
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 密码强度检测
function checkPasswordStrength(password) {
    const strengthIndicator = document.getElementById('passwordStrength');
    const strengthBar = strengthIndicator.querySelector('.password-strength-fill');
    const strengthText = strengthIndicator.querySelector('.password-strength-text');
    
    let strength = 0;
    let feedback = '';
    
    if (password.length >= 6) strength++;
    if (password.match(/[a-z]/)) strength++;
    if (password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;
    
    strengthIndicator.className = 'password-strength';
    
    if (strength <= 2) {
        strengthIndicator.classList.add('password-strength-weak');
        feedback = '密码强度：弱';
    } else if (strength <= 3) {
        strengthIndicator.classList.add('password-strength-medium');
        feedback = '密码强度：中等';
    } else {
        strengthIndicator.classList.add('password-strength-strong');
        feedback = '密码强度：强';
    }
    
    strengthText.textContent = feedback;
}

// 邮箱可用性检查
function checkEmailAvailability(email) {
    const feedback = document.getElementById('emailFeedback');
    
    if (!email) {
        feedback.innerHTML = '';
        return;
    }
    
    // 显示检查状态
    feedback.innerHTML = '<small class="text-muted"><i class="fas fa-spinner fa-spin"></i> 检查邮箱可用性...</small>';
    
    // 模拟API调用
    setTimeout(() => {
        fetch(`/auth/api/check-email?email=${encodeURIComponent(email)}`)
            .then(response => response.json())
            .then(data => {
                if (data.available) {
                    feedback.innerHTML = '<small class="text-success"><i class="fas fa-check"></i> 邮箱可用</small>';
                    document.getElementById('email').classList.remove('is-invalid');
                    document.getElementById('email').classList.add('is-valid');
                } else {
                    feedback.innerHTML = `<small class="text-danger"><i class="fas fa-times"></i> ${data.message}</small>`;
                    document.getElementById('email').classList.remove('is-valid');
                    document.getElementById('email').classList.add('is-invalid');
                }
            })
            .catch(error => {
                feedback.innerHTML = '<small class="text-warning"><i class="fas fa-exclamation-triangle"></i> 检查失败，请稍后重试</small>';
            });
    }, 500);
}

// 表单验证
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const firstName = document.getElementById('first_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const agree = document.getElementById('agree').checked;
    
    // 基础验证
    if (!firstName || !email || !password || !confirmPassword) {
        alert('请填写所有必填字段');
        return;
    }
    
    if (!agree) {
        alert('请同意服务条款和隐私政策');
        return;
    }
    
    // 密码验证
    if (password !== confirmPassword) {
        alert('两次输入的密码不一致');
        document.getElementById('confirm_password').classList.add('shake');
        setTimeout(() => {
            document.getElementById('confirm_password').classList.remove('shake');
        }, 500);
        return;
    }
    
    if (password.length < 6) {
        alert('密码长度至少6位');
        return;
    }
    
    // 显示加载状态
    const submitBtn = document.getElementById('registerBtn');
    const loading = document.getElementById('registerLoading');
    
    submitBtn.style.display = 'none';
    loading.classList.add('show');
    
    // 提交表单
    setTimeout(() => {
        this.submit();
    }, 1000);
});

// 密码输入事件
document.getElementById('password').addEventListener('input', function() {
    checkPasswordStrength(this.value);
});

// 确认密码验证
document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirmPassword = this.value;
    
    if (confirmPassword && password !== confirmPassword) {
        this.classList.add('is-invalid');
        if (!this.parentNode.nextElementSibling || !this.parentNode.nextElementSibling.classList.contains('invalid-feedback')) {
            const feedback = document.createElement('div');
            feedback.className = 'invalid-feedback';
            feedback.textContent = '密码不一致';
            this.parentNode.parentNode.appendChild(feedback);
        }
    } else {
        this.classList.remove('is-invalid');
        const feedback = this.parentNode.parentNode.querySelector('.invalid-feedback');
        if (feedback) {
            feedback.remove();
        }
        if (confirmPassword && password === confirmPassword) {
            this.classList.add('is-valid');
        }
    }
});

// 邮箱验证
let emailTimeout;
document.getElementById('email').addEventListener('input', function() {
    const email = this.value.trim();
    
    clearTimeout(emailTimeout);
    
    if (email) {
        emailTimeout = setTimeout(() => {
            checkEmailAvailability(email);
        }, 800);
    } else {
        document.getElementById('emailFeedback').innerHTML = '';
    }
});

// 姓名验证
document.getElementById('first_name').addEventListener('input', function() {
    if (this.value.trim()) {
        this.classList.remove('is-invalid');
        this.classList.add('is-valid');
    } else {
        this.classList.remove('is-valid');
    }
});
</script>
{% endblock %}
