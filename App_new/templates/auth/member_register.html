{% extends "guest/shared/base.html" %}

{% block title %}会员注册 - 悦行假期{% endblock %}

{% block extra_css %}
    <style>
        /* 重置body样式，避免与base模板冲突 */
        body {
            background: linear-gradient(135deg, #28a745 0%, #34ce57 100%) !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        
        /* 只隐藏页脚，保留导航栏 */
        .footer {
            display: none !important;
        }
        
        /* 调整导航栏样式 */
        .navbar {
            position: relative !important;
            z-index: 30 !important;
        }
        
        /* 注册页面容器 */
        .register-page {
            min-height: calc(100vh - 56px); /* 减去导航栏高度 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
            margin-top: 56px; /* 为导航栏留出空间 */
        }

        .auth-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            z-index: 10;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(40, 167, 69, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #28a745 0%, #34ce57 100%);
        }

        .auth-header {
            margin-bottom: 2rem;
        }

        .auth-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #28a745 0%, #34ce57 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            font-size: 2rem;
        }

        .auth-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: #666;
            font-size: 1rem;
            margin-bottom: 0;
        }

        .auth-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            outline: none;
            border-color: #28a745;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #28a745 0%, #34ce57 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
        }

        .auth-footer p {
            color: #666;
            margin-bottom: 0;
        }

        .auth-footer a {
            color: #28a745;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-weight: 500;
            z-index: 20;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: white;
            text-decoration: none;
            transform: translateX(-5px);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .auth-container {
                max-width: 100%;
                padding: 0 1.5rem;
            }
            
            .auth-card {
                padding: 2rem 1.5rem;
            }
            
            .back-link {
                top: 1rem;
                left: 1rem;
            }
            
            .register-page {
                margin-top: 0;
                min-height: 100vh;
            }
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="register-page">
        <a href="{{ url_for('auth_profile.member_login') }}" class="back-link">
            <i class="fas fa-arrow-left me-2"></i>返回登录
        </a>

        <div class="auth-container">
            <div class="auth-card fade-in-up">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h1 class="auth-title">会员注册</h1>
                    <p class="auth-subtitle">加入我们，享受专属旅游服务</p>
                </div>

                <!-- 显示消息 -->
                {% include 'shared/_flash_toast.html' %}

                <form method="POST" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="first_name" class="form-label">
                                    <i class="fas fa-user me-2"></i>姓氏 *
                                </label>
                                <input type="text" class="form-control" id="first_name" name="first_name" 
                                       placeholder="请输入您的姓氏" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="last_name" class="form-label">
                                    <i class="fas fa-user me-2"></i>名字
                                </label>
                                <input type="text" class="form-control" id="last_name" name="last_name" 
                                       placeholder="请输入您的名字">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-2"></i>邮箱地址 *
                        </label>
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="请输入您的邮箱地址" required>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">
                            <i class="fas fa-phone me-2"></i>手机号码 *
                        </label>
                        <input type="tel" class="form-control" id="phone" name="phone" 
                               placeholder="请输入您的手机号码" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>密码 *
                                </label>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="请输入密码" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="confirm_password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>确认密码 *
                                </label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                       placeholder="请再次输入密码" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agree_terms" name="agree_terms" required>
                            <label class="form-check-label" for="agree_terms">
                                我已阅读并同意 <a href="#" class="text-primary">服务条款</a> 和 <a href="#" class="text-primary">隐私政策</a>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-register">
                        <i class="fas fa-user-plus me-2"></i>立即注册
                    </button>
                </form>

                <div class="auth-footer">
                    <p>已有账户？ <a href="{{ url_for('auth_profile.member_login') }}">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
