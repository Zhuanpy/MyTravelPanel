<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a5f">
    <title>员工登录 - MyTravelPanel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Hero区域 - 与首页统一 */
        .hero {
            position: relative;
            height: 220px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            overflow: hidden;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.2) 0%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.4) 100%
            );
        }

        .hero-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            text-align: center;
            color: white;
        }

        /* 顶部导航 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            z-index: 10;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .back-btn i {
            font-size: 14px;
        }

        /* Logo和标题 */
        .hero-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .hero-icon i {
            font-size: 28px;
            color: white;
        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }

        .hero-subtitle {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        /* 登录卡片 */
        .login-card {
            background: white;
            margin: -40px auto 30px;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: calc(100% - 40px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .login-icon i {
            font-size: 24px;
            color: white;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #64748b;
        }

        /* 提示消息 */
        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-danger {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-label i {
            margin-right: 8px;
            color: #10b981;
        }

        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #10b981;
            background: white;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        /* 记住我 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #10b981;
        }

        .forgot-link {
            font-size: 14px;
            color: #10b981;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            color: #059669;
        }

        /* 登录按钮 */
        .btn-login {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 26px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* 分隔线 */
        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            padding: 0 16px;
        }

        /* 其他登录选项 */
        .auth-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .auth-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: #f1f5f9;
            border-radius: 20px;
            color: #475569;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .auth-link:hover {
            background: #e2e8f0;
            color: #10b981;
        }

        .auth-link i {
            font-size: 14px;
        }

        /* 页脚信息 */
        .footer-info {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 12px;
        }

        .footer-info i {
            margin-right: 6px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-card {
                padding: 24px 20px;
                margin: -40px 16px 24px;
            }

            .hero {
                height: 200px;
            }

            .hero-icon {
                width: 56px;
                height: 56px;
            }

            .hero-icon i {
                font-size: 24px;
            }

            .hero-title {
                font-size: 20px;
            }

            .auth-links {
                gap: 12px;
            }

            .auth-link {
                padding: 8px 14px;
                font-size: 12px;
            }
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            animation: fadeInUp 0.5s ease-out;
        }
    </style>
</head>
<body>

<!-- Hero区域 -->
<section class="hero">
    <div class="hero-overlay"></div>

    <!-- 顶部返回 -->
    <div class="top-bar">
        <a href="{{ url_for('public.index') }}" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            返回首页
        </a>
    </div>

    <div class="hero-content">
        <div class="hero-icon">
            <i class="fas fa-user-tie"></i>
        </div>
        <h1 class="hero-title">员工登录</h1>
        <p class="hero-subtitle">MyTravelPanel 内部系统</p>
    </div>
</section>

<!-- 登录卡片 -->
<main class="login-card">
    <div class="login-header">
        <div class="login-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2 class="login-title">欢迎回来</h2>
        <p class="login-subtitle">请输入您的员工凭据</p>
    </div>

    <!-- 显示消息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else ('info' if category == 'info' else 'danger') }}">
                <i class="fas fa-{{ 'check-circle' if category == 'success' else ('info-circle' if category == 'info' else 'exclamation-triangle') }}"></i>
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth_profile.staff_login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-envelope"></i>邮箱地址
            </label>
            <input type="email" name="email" class="form-input" placeholder="请输入您的邮箱地址" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-lock"></i>密码
            </label>
            <input type="password" name="password" class="form-input" placeholder="请输入您的密码" required>
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" name="remember" value="1">
                记住我的登录状态
            </label>
            <a href="{{ url_for('auth_profile.forgot_password') }}" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i>
            登录
        </button>
    </form>

    <div class="divider">
        <span>其他选项</span>
    </div>

    <div class="auth-links">
        <a href="{{ url_for('auth_profile.member_login') }}" class="auth-link">
            <i class="fas fa-user"></i>
            会员登录
        </a>
        <a href="{{ url_for('admin_auth.login') }}" class="auth-link">
            <i class="fas fa-user-shield"></i>
            管理员
        </a>
    </div>
</main>

<!-- 页脚信息 -->
<div class="footer-info">
    <i class="fas fa-shield-alt"></i>
    您的信息将被安全加密保护
</div>

</body>
</html>
