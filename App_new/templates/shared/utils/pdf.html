{% extends "staff_base.html" %}

{% block title %}PDF处理 - MyTravelPanel{% endblock %}

{% block page_title %}PDF处理{% endblock %}

{% block extra_css %}
<style>
    .pdf-page-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    
    .pdf-page-title {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2rem;
        font-weight: 600;
        color: #2d3748;
    }
    
    .pdf-page-section {
        margin-top: 30px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
        font-size: 1.5rem;
        font-weight: 600;
        color: #2d3748;
    }
    
    .pdf-page-form {
        background-color: #f9f9f9;
        padding: 20px;
        border-radius: 5px;
        margin-bottom: 20px;
    }
    
    .pdf-page-label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }
    
    .pdf-page-input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    
    .pdf-page-button {
        background-color: #ECC94B;
        color: #2D3748;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
    
    .pdf-page-button:hover {
        background-color: #D69E2E;
    }
    
    .pdf-page-button:disabled {
        background-color: #f3d98d;
        cursor: not-allowed;
    }
    
    .pdf-page-success-message {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #48BB78;
        color: white;
        padding: 15px 20px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 1000;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .pdf-page-success-message.show {
        opacity: 1;
    }
    
    .pdf-page-error-message {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #E53E3E;
        color: white;
        padding: 15px 20px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 1000;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .pdf-page-error-message.show {
        opacity: 1;
    }
</style>
{% endblock %}

{% block content %}
<div id="successMessage" class="pdf-page-success-message"></div>
<div class="pdf-page-container">
    <h1 class="pdf-page-title">PDF文件处理</h1>

    <!-- 图片合并表单 -->
    <h2 class="pdf-page-section">图片合并为PDF</h2>
    <form id="imageForm" class="pdf-page-form" method="post" action="{{url_for('utils_process.merge_images_to_pdf')}}" onsubmit="return handleSubmit(this, event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="imageFolderPath" class="pdf-page-label">图片文件夹路径:</label>
        <input type="text" id="imageFolderPath" name="imageFolderPath" class="pdf-page-input">
        <button type="submit" name="submit_button" value="merge_images" class="pdf-page-button">图片合并为PDF</button>
    </form>

    <!-- 多个PDF合并表单 -->
    <h2 class="pdf-page-section">多个PDF合并</h2>
    <form id="pdfForm" class="pdf-page-form" method="post" action="{{url_for('utils_process.merge_pdf_to_pdf')}}" onsubmit="return handleSubmit(this, event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="pdfFolderPath" class="pdf-page-label">PDF文件夹路径:</label>
        <input type="text" id="pdfFolderPath" name="pdfFolderPath" class="pdf-page-input">
        <button type="submit" name="submit_button" value="merge_images" class="pdf-page-button">多个PDF合并</button>
    </form>

    <!-- Word转换PDF表单 -->
    <h2 class="pdf-page-section">Word转换PDF</h2>
    <form id="wordForm" class="pdf-page-form" method="post" action="{{url_for('utils_process.word_to_pdf')}}" onsubmit="return handleSubmit(this, event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="wordFolderPath" class="pdf-page-label">Word文件夹路径:</label>
        <input type="text" id="wordFolderPath" name="wordFolderPath" class="pdf-page-input" required>
        <button type="submit" name="submit_button" value="merge_images" class="pdf-page-button">Word转PDF</button>
    </form>

    <!-- 长截图切分打印表单 -->
    <h2 class="pdf-page-section">长截图切分打印</h2>
    <form id="screenshotForm" class="pdf-page-form" method="post" action="{{url_for('utils_process.split_screenshot_to_pdf')}}" onsubmit="return handleSubmit(this, event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="screenshotFolderPath" class="pdf-page-label">长截图文件夹路径:</label>
        <input type="text" id="screenshotFolderPath" name="screenshotFolderPath" class="pdf-page-input" required>
        <div style="margin-bottom: 15px;">
            <label for="marginSize" class="pdf-page-label">上下边距 (毫米):</label>
            <input type="number" id="marginSize" name="marginSize" class="pdf-page-input" value="20" min="0" max="50" style="width: 150px;">
        </div>
        <button type="submit" name="submit_button" value="split_screenshot" class="pdf-page-button">长截图切分打印</button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function handleSubmit(form, event) {
    event.preventDefault(); // 阻止表单默认提交
    const formData = new FormData(form);
    
    // 保存按钮原始文本
    const submitButton = form.querySelector('button[type="submit"]');
    if (!submitButton.getAttribute('data-original-text')) {
        submitButton.setAttribute('data-original-text', submitButton.innerHTML);
    }
    
    // 禁用提交按钮，防止重复提交
    submitButton.disabled = true;
    
    // 显示加载状态
    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
    
    fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': document.querySelector('input[name="csrf_token"]').value
        }
    })
    .then(response => {
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.indexOf('application/json') !== -1) {
            return response.json();
        } else {
            return response.text().then(text => { throw new Error(text); });
        }
    })
    .then(data => {
        if (data.success) {
            showSuccessMessage(data.message);
        } else {
            showErrorMessage(data.message || '处理失败，请重试');
        }
    })
    .catch(error => {
        // 这里 error.message 可能是HTML
        if (error.message && error.message.startsWith('<!DOCTYPE')) {
            showErrorMessage('服务器返回错误页面，请联系管理员或检查后端日志。');
        } else {
            showErrorMessage(error.message || '处理出错，请重试');
        }
    })
    .finally(() => {
        submitButton.disabled = false;
        submitButton.innerHTML = submitButton.getAttribute('data-original-text');
    });

    return false;
}

function showSuccessMessage(message) {
    const successDiv = document.getElementById('successMessage');
    successDiv.textContent = message;
    successDiv.className = 'pdf-page-success-message show';
    // 3秒后自动隐藏
    setTimeout(() => {
        successDiv.className = 'pdf-page-success-message';
    }, 3000);
}

function showErrorMessage(message) {
    const successDiv = document.getElementById('successMessage');
    successDiv.textContent = message;
    successDiv.className = 'pdf-page-error-message show';
    // 3秒后自动隐藏
    setTimeout(() => {
        successDiv.className = 'pdf-page-error-message';
    }, 3000);
}
</script>
{% endblock %}
