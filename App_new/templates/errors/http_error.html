<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - MyTravelPanel</title>
    {# 刻意不继承 staff_base：错误页要在未登录、模板变量缺失等异常状态下也能渲染出来，
       不能再依赖 current_user / url_for 端点，否则错误处理器自己会再抛一次异常。 #}
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #f8f9fa; color: #343a40;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
        .box { text-align: center; padding: 2.5rem 2rem; max-width: 560px; }
        .code { font-size: 5rem; font-weight: 300; color: #adb5bd; line-height: 1; margin-bottom: .5rem; }
        .title { font-size: 1.5rem; margin: 0 0 1rem; }
        .detail { color: #6c757d; font-size: .95rem; line-height: 1.6; word-break: break-word; margin-bottom: 2rem; }
        .actions a { display: inline-block; margin: 0 .4rem; padding: .5rem 1.4rem; border-radius: 6px;
                     text-decoration: none; font-size: .9rem; }
        .primary { background: #0d6efd; color: #fff; }
        .secondary { background: #e9ecef; color: #343a40; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">{{ error_code }}</div>
        <h1 class="title">{{ error_title }}</h1>
        <div class="detail">{{ error_message }}</div>
        <div class="actions">
            <a class="primary" href="/">返回首页</a>
            <a class="secondary" href="javascript:history.back()">返回上页</a>
        </div>
    </div>
</body>
</html>
